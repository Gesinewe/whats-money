<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lernspiel über Geld: Begleite Moni durch 14 Stationen und lege ihr Geld im Simulator an.">
<meta name="theme-color" content="#ECF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1917" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<title>What's money?</title>
<style>
/* Layout: eine Spalte wie ein Sparbuch — Kopfzeile mit Geldbörse, darunter Karte, Station oder Simulator. Banknoten-Guilloche als einziges Ornament. */
:root{
  --paper:#ECF1EC; --card:#FAFCF9; --ink:#15302B; --muted:#5A6E68; --line:#CCD8D1;
  --mint:#1D7A61; --mint-soft:#D5EBE2; --gold:#C38F22; --gold-soft:#F5E6C4; --coin:#E3B341; --coin-dark:#A87618;
  --red:#B2453B; --red-soft:#F4DCD8; --onaccent:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1917; --card:#172421; --ink:#E3EDE8; --muted:#97ABA4; --line:#2B3D38;
  --mint:#55C3A2; --mint-soft:#1D3A32; --gold:#E3B24E; --gold-soft:#3A2F17; --coin:#E3B341; --coin-dark:#A87618;
  --red:#E58176; --red-soft:#3D221F; --onaccent:#0F1917; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F1917; --card:#172421; --ink:#E3EDE8; --muted:#97ABA4; --line:#2B3D38;
  --mint:#55C3A2; --mint-soft:#1D3A32; --gold:#E3B24E; --gold-soft:#3A2F17; --coin:#E3B341; --coin-dark:#A87618;
  --red:#E58176; --red-soft:#3D221F; --onaccent:#0F1917; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.app{max-width:880px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,4.5vw,2rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--mint)}

/* Kopfzeile */
.top{position:relative;overflow:hidden;border:1.5px solid var(--ink);border-radius:18px;padding:18px 20px;background:var(--card);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top::before{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;
  background:
   repeating-radial-gradient(circle at 105% 120%, var(--mint) 0 1px, transparent 1px 9px),
   repeating-radial-gradient(circle at -5% -40%, var(--gold) 0 1px, transparent 1px 11px)}
.brand{position:relative;flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:14px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand small{display:block;font-size:.9rem;color:var(--muted);margin-top:4px}
.wallet{position:relative;display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:120px}
.chip b{font-family:var(--f-num);font-size:1.15rem}
.chip.gold{background:var(--gold-soft)}
.plus{position:absolute;right:10px;top:-6px;font-family:var(--f-num);font-weight:600;color:var(--mint);animation:rise 1.2s ease-out forwards;pointer-events:none}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}

/* Moni */
.moni{flex:none;width:64px;height:64px}
.moni.big{width:110px;height:110px}
.moni .body{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 60%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.say{display:flex;gap:14px;align-items:flex-start}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.bubble b{color:var(--mint)}

/* Karte */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.st{position:relative;text-align:left;border:1.5px solid var(--ink);border-radius:16px;background:var(--card);padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start;transition:transform .15s ease, box-shadow .15s ease}
.st:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
.st:disabled{cursor:not-allowed;opacity:.5;border-style:dashed}
.st .c{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:1.05rem;color:#3B2A06;background:radial-gradient(circle at 35% 30%, #F6DA86, var(--coin) 55%, var(--coin-dark));border:2px solid var(--coin-dark)}
.st.done .c{box-shadow:0 0 0 3px var(--mint)}
.st .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.st .t strong{font-family:var(--f-display);font-size:1.08rem}
.st .t span{font-size:.92rem;color:var(--muted)}
.stars{font-size:.95rem;letter-spacing:2px;color:var(--gold)}
.stars i{font-style:normal;color:var(--line)}
.st.final{grid-column:1/-1;background:var(--mint-soft)}
.st.final .c{background:var(--mint);border-color:var(--mint);color:var(--onaccent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.toggle{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}

/* Station */
.panel{border:1.5px solid var(--ink);border-radius:18px;background:var(--card);padding:20px;display:flex;flex-direction:column;gap:16px}
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700}
.lesson h3{font-size:1.45rem;margin-bottom:8px}
.lesson p{max-width:62ch}
.lesson.fact{background:var(--gold-soft);border-radius:14px;padding:16px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--mint)}
.btn{border:1.5px solid var(--ink);border-radius:12px;padding:10px 18px;font-weight:700;background:var(--paper)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--onaccent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.answers{display:grid;gap:10px}
.ans{text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.ans:hover:not(:disabled){border-color:var(--ink)}
.ans.right{border-color:var(--mint);background:var(--mint-soft);font-weight:700}
.ans.wrong{border-color:var(--red);background:var(--red-soft)}
.ans:disabled{cursor:default}
.expl{border-left:4px solid var(--mint);padding:8px 12px;background:var(--paper);border-radius:0 10px 10px 0}
.expl.bad{border-left-color:var(--red)}

/* Werkzeuge */
.tool{display:grid;gap:14px}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px}
.sl{display:flex;flex-direction:column;gap:4px;min-width:0}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.sl label b{font-family:var(--f-num)}
input[type=range]{width:100%;accent-color:var(--mint)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.kpi b{display:block;font-family:var(--f-num);font-size:1.25rem;font-variant-numeric:tabular-nums}
.kpi.hl{border-color:var(--mint)}
canvas{width:100%;height:240px;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--k)}
.ledger{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.ledger > div{padding:12px;min-width:0}
.ledger > div + div{border-left:1.5px solid var(--ink)}
.ledger h4{margin:0 0 6px;font-family:var(--f-display);font-size:1rem}
.ledger .line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;padding:3px 0;border-bottom:1px dashed var(--line)}
.ledger .line b{font-family:var(--f-num);font-weight:600}
.sort{display:grid;gap:8px}
.sort .it{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.sort .it.ok{border-color:var(--mint)}
.sort .it.no{border-color:var(--red)}
.sort .it small{display:block;color:var(--muted);font-size:.85rem}
.mini{border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--card);font-size:.9rem;font-weight:700}

/* Simulator */
.alloc{display:grid;gap:10px}
.al{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.al.locked{opacity:.55;border-style:dashed}
.al .nm{min-width:0}
.al .nm small{display:block;color:var(--muted);font-size:.84rem}
.al .pc{font-family:var(--f-num);text-align:right}
.al input{grid-column:1/-1}
#simCtl{display:grid;gap:12px}
.al .trade{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.al .trade .grp{display:flex;gap:6px;align-items:center}
.al .amt{width:96px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--card);font:inherit;font-size:.9rem;font-family:var(--f-num)}
.al .amt:disabled{opacity:.4}
.mini[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--onaccent)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:16px;border-radius:8px;background:var(--c);min-width:2px;transition:width .2s ease}
.bar b{font-family:var(--f-num);text-align:right;font-weight:600;white-space:nowrap}
@media (max-width:520px){.bar{grid-template-columns:1fr auto}.bar i{grid-column:1/-1;grid-row:2}}
.mini:disabled{opacity:.4;cursor:not-allowed}
.gain{color:var(--mint)} .loss{color:var(--red)}
.info{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--paper)}
.info summary{cursor:pointer;font-weight:700}
.info ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.info p{margin-top:8px}
.src{font-size:.9rem}
.src a{overflow-wrap:anywhere}
.seg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg .label{margin-right:4px}
.seg button{border:1.5px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--card);font-size:.9rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--onaccent)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg small{flex-basis:100%;font-size:.84rem;color:var(--muted)}
.news{font-family:var(--f-num);font-size:.85rem;max-height:170px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.news .bad{color:var(--red)} .news .good{color:var(--mint)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl .num{white-space:nowrap}
.tblwrap{overflow-x:auto}
.result-stars{font-size:2rem;color:var(--gold);letter-spacing:6px}
.result-stars i{font-style:normal;color:var(--line)}
footer{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){
  .ledger{grid-template-columns:1fr}
  .ledger > div + div{border-left:0;border-top:1.5px solid var(--ink)}
  .moni.big{width:80px;height:80px}
  .al{grid-template-columns:minmax(0,1fr) 90px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* Nur in der App: Abstand zu Notch, Kamera-Loch und Home-Leiste; kein Zoom-Flackern beim Antippen */
.app{padding-top:max(16px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(48px,calc(env(safe-area-inset-bottom) + 24px))}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,summary,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>


<div class="app">
  <header class="top">
    <button class="brand" id="home" aria-label="Zur Karte">
      <span id="moniTop"></span>
      <span><h1>What's money?</h1><small>Moni will sein Geld klug anlegen – und lernt dafür alles über Geld.</small></span>
    </button>
    <div class="wallet" id="wallet"></div>
  </header>
  <main id="view"></main>
  <footer>
    <p>Lernspiel, keine Anlageberatung. Zahlen mit Stand Herbst 2026; die Renditen im Simulator sind grobe Spielannahmen nach historischen Schwankungen, keine Prognose.</p>
    <p>Quellen: Unter den Lernkarten jeder Station und unter dem Simulator findest du aufklappbar, woher die Informationen stammen.</p>
  </footer>
</div>

<script>
/* ---------- Inhalte ---------- */
const STATIONS = [
{ id:'tausch',
  src:[["Wikipedia: Tauschhandel", "https://de.wikipedia.org/wiki/Tauschhandel"], ["Wikipedia: Geldfunktion", "https://de.wikipedia.org/wiki/Geldfunktion"], ["Wikipedia: Warengeld", "https://de.wikipedia.org/wiki/Warengeld"], ["Wikipedia: Kaurigeld", "https://de.wikipedia.org/wiki/Kaurigeld"], ["Wikipedia: Rai (Steingeld von Yap)", "https://de.wikipedia.org/wiki/Rai_(Währung)"], ["Wikipedia: Zigarettenwährung", "https://de.wikipedia.org/wiki/Zigarettenwährung"], ["Wikipedia: Währungsreform 1948", "https://de.wikipedia.org/wiki/Währungsreform_1948_(Westdeutschland)"]], name:'Tauschmarkt', topic:'Was alles schon Geld war',
  moni:'Ich hab 1.000 € gespart. Aber bevor ich irgendwas anlege: Was <b>ist</b> Geld eigentlich? Fangen wir ganz vorne an – bei Leuten, die gar keins hatten.',
  cards:[
   ['Tauschen ist mühsam','Ohne Geld musst du jemanden finden, der genau das hat, was du willst – und der gleichzeitig genau das will, was du hast. Fachleute nennen das die „doppelte Übereinstimmung der Wünsche“. Meist klappt das nicht. Deshalb haben Menschen überall auf der Welt Geld erfunden.', "Stell dir vor, du hast Äpfel und willst Schuhe. Dann musst du jemanden finden, der Schuhe hat <b>und</b> gerade Äpfel braucht. Das ist ganz schön schwer! Deshalb haben Menschen überall auf der Welt Geld erfunden."],
   ['Drei Jobs für Geld','Geld ist <b>Tauschmittel</b> (man bezahlt damit), <b>Recheneinheit</b> (man vergleicht damit Preise) und <b>Wertaufbewahrung</b> (man kann es für später behalten). Alles, was diese drei Jobs gut genug erledigt, kann Geld sein.', "Geld hat drei Aufgaben: Man kann damit <b>bezahlen</b>. Man kann damit <b>vergleichen</b>, was teuer und was billig ist. Und man kann es <b>aufheben</b>, um später etwas zu kaufen."],
   ['Kühe, Salz und Kakao','Vieh war eines der ältesten Zahlungsmittel – lateinisch <i>pecus</i>, daraus wurde <i>pecunia</i>, das Geld. Römische Soldaten bekamen Geld für Salz, das <i>salarium</i> – unser „Salär“. Die Azteken zahlten mit Kakaobohnen, in Tibet und China nutzte man gepresste Teeziegel, in Virginia im 17. Jahrhundert Tabak.', "Früher waren Kühe Geld. Auf Lateinisch heißt Vieh <i>pecus</i> – daraus wurde <i>pecunia</i>, das Geld. Römische Soldaten bekamen Geld für Salz, die Azteken bezahlten mit Kakaobohnen."],
   ['Muscheln als Weltwährung','Kaurischnecken waren über Jahrtausende in Afrika, Indien und China Geld: haltbar, handlich, schwer zu fälschen, leicht zu zählen. Das chinesische Schriftzeichen für Wert und Handel (貝) zeigt bis heute eine Muschel.'],
   ['Steine, die nie bewegt wurden','Auf der Pazifikinsel Yap gibt es Rai-Steine: Scheiben bis zu 4 Meter groß. Weil man sie kaum tragen kann, wechselte nur der Besitz – per Absprache. Ein Stein soll beim Transport im Meer versunken sein und galt trotzdem weiter als Vermögen. Geld kann also auch nur eine gemeinsame Erinnerung sein, wem was gehört.'],
   ['Zigaretten statt Reichsmark','In Deutschland war von 1945 bis 1948 die Reichsmark fast wertlos. Auf dem Schwarzmarkt bezahlte man mit Zigaretten. Das endete am 20. Juni 1948 mit der Währungsreform und der D-Mark.', "Nach dem Zweiten Weltkrieg war das deutsche Geld fast nichts mehr wert. Da bezahlten viele Leute mit Zigaretten. 1948 kam neues Geld: die D-Mark."],
   ['Was gutes Geld braucht','Haltbar, teilbar, leicht zu tragen, knapp, überall gleich und schwer zu fälschen. Muscheln, Metalle, Papier und Zahlen im Computer haben diese Eigenschaften unterschiedlich gut erfüllt – deshalb hat sich Geld immer wieder verändert.']
  ],
  fact:'Auf Yap werden Rai-Steine bis heute bei Hochzeiten und Zeremonien verschenkt – obwohl dort im Alltag mit US-Dollar bezahlt wird.',
  quiz:[
   ['Woher kommt das lateinische Wort <i>pecunia</i> (Geld)?',['Von <i>pecus</i> – Vieh','Von der Stadt Peking','Vom Vogel, der Körner pickt','Von <i>pix</i> – Pech'],0,'Vieh war eines der ersten Zahlungsmittel. Aus <i>pecus</i> wurde <i>pecunia</i>.'],
   ['Was gehört NICHT zu den drei Aufgaben von Geld?',['Tauschmittel','Recheneinheit','Wertaufbewahrung','Glück bringen'],3,'Tauschmittel, Recheneinheit, Wertaufbewahrung – das sind die drei Jobs.', ["Was gehört NICHT zu den Aufgaben von Geld?", ["Bezahlen", "Preise vergleichen", "Für später aufheben", "Glück bringen"], 3, "Bezahlen, vergleichen, aufheben – das sind die drei Jobs von Geld."]],
   ['Womit wurde in Deutschland 1946 auf dem Schwarzmarkt oft bezahlt?',['Mit Kaurimuscheln','Mit Zigaretten','Mit Teeziegeln','Mit Goldbarren'],1,'Die Reichsmark war kaum etwas wert, Zigaretten wurden zur Ersatzwährung – bis zur Währungsreform 1948.'],
   ['Was ist das Besondere an den Rai-Steinen von Yap?',['Sie sind aus purem Gold','Man konnte sie essen','Sie blieben liegen – nur der Besitz wechselte per Absprache','Sie durften nur Kinder benutzen'],2,'Der Stein bewegt sich nicht, nur die Information, wem er gehört. Ganz ähnlich wie heute Geld auf Konten.']
  ]},
{ id:'markt',
  src:[["Wikipedia: Preisbildung", "https://de.wikipedia.org/wiki/Preisbildung"], ["Wikipedia: Angebot und Nachfrage", "https://de.wikipedia.org/wiki/Angebot_und_Nachfrage"], ["Wikipedia: Marktgleichgewicht", "https://de.wikipedia.org/wiki/Marktgleichgewicht"], ["Wikipedia: Unsichtbare Hand", "https://de.wikipedia.org/wiki/Unsichtbare_Hand"], ["Wikipedia: Marktwirtschaft", "https://de.wikipedia.org/wiki/Marktwirtschaft"], ["Wikipedia: Marktversagen", "https://de.wikipedia.org/wiki/Marktversagen"], ["Wikipedia: Bundeskartellamt", "https://de.wikipedia.org/wiki/Bundeskartellamt"], ["Wikipedia: Zentralverwaltungswirtschaft (Planwirtschaft)", "https://de.wikipedia.org/wiki/Zentralverwaltungswirtschaft"], ["Wikipedia: Fünfjahresplan", "https://de.wikipedia.org/wiki/Fünfjahresplan"], ["Wikipedia: Gosplan", "https://de.wikipedia.org/wiki/Gosplan"], ["Wikipedia: Mangelwirtschaft", "https://de.wikipedia.org/wiki/Mangelwirtschaft"], ["Wikipedia: Konsumgüterproduktion in der DDR (Wartezeit auf Autos)", "https://de.wikipedia.org/wiki/Konsumgüterproduktion_in_der_DDR"], ["Wikipedia: Verfügbarkeit von Pkw in der DDR", "https://de.wikipedia.org/wiki/Verfügbarkeit_von_Pkw_in_der_DDR"], ["Berliner Zeitung: Sargnägel für die DDR – die Preispolitik", "https://www.berliner-zeitung.de/article/sargnaegel-fuer-die-ddr-die-preispolitik-trieb-skurrile-blueten-reform-unmoeglich-318440"], ["Wikipedia: Soziale Marktwirtschaft", "https://de.wikipedia.org/wiki/Soziale_Marktwirtschaft"], ["Wikipedia: Ludwig Erhard", "https://de.wikipedia.org/wiki/Ludwig_Erhard"], ["bpb: Kleine Ereignisgeschichte der Währungsreform 1948", "https://www.bpb.de/apuz/271679/kleine-ereignisgeschichte-der-waehrungsreform-1948"], ["Wikipedia: Höchstpreis", "https://de.wikipedia.org/wiki/Höchstpreis"], ["Wikipedia: Mindestpreis", "https://de.wikipedia.org/wiki/Mindestpreis"], ["Wikipedia: Butterberg", "https://de.wikipedia.org/wiki/Butterberg"], ["Wikipedia: Mietpreisbremse", "https://de.wikipedia.org/wiki/Mietpreisbremse"], ["Wikipedia: Mindestlohn", "https://de.wikipedia.org/wiki/Mindestlohn"], ["Limonaden-Spiel: ausgedachte Zahlen zum Ausprobieren", null]], name:'Marktplatz', topic:'Angebot, Nachfrage und wer die Preise macht', extra:'markt',
  moni:'Warum kosten Erdbeeren im Winter so viel mehr als im Sommer? Und wer bestimmt eigentlich, was etwas kostet – der Verkäufer, der Staat oder wir alle zusammen?',
  cards:[
   ['Was ist ein Markt?','Ein Markt ist überall dort, wo Käufer und Verkäufer zusammenkommen: auf dem Wochenmarkt, im Supermarkt, im Internet oder an der Börse. Alle, die etwas kaufen wollen, bilden die <b>Nachfrage</b>. Alle, die etwas verkaufen wollen, bilden das <b>Angebot</b>.', "Ein Markt ist überall dort, wo jemand etwas verkauft und jemand anderes etwas kauft – auf dem Wochenmarkt, im Supermarkt oder im Internet. Wer kaufen will, ist die <b>Nachfrage</b>. Wer verkaufen will, ist das <b>Angebot</b>."],
   ['Wie ein Preis entsteht','Wollen viele etwas haben, das knapp ist, steigt der Preis. Gibt es mehr davon, als die Leute wollen, sinkt er. Irgendwo dazwischen treffen sich Angebot und Nachfrage: beim <b>Marktpreis</b>. Zu diesem Preis wird genau so viel verkauft, wie gekauft werden soll.', "Im Sommer gibt es viele Erdbeeren – dann sind sie billig. Im Winter gibt es kaum welche, aber manche Leute wollen trotzdem Erdbeeren – dann sind sie teuer. Gibt es wenig von etwas, das viele wollen, steigt der Preis. Gibt es viel davon, sinkt er."],
   ['Preise sind Signale','Ein hoher Preis sagt den Herstellern: Davon wird mehr gebraucht, es lohnt sich, mehr herzustellen. Ein niedriger Preis sagt: Davon gibt es genug. So steuern Millionen Preise, was hergestellt wird – ohne dass jemand alles planen muss. Der Ökonom Adam Smith beschrieb das 1776 mit dem Bild der „unsichtbaren Hand“.', "Ein hoher Preis ist wie ein Zeichen: „Davon brauchen wir mehr!“ Dann stellen Firmen mehr davon her, weil sie damit gut verdienen. Ein niedriger Preis sagt: „Davon gibt es genug.“"],
   ['Marktwirtschaft','In einer <b>Marktwirtschaft</b> entscheiden Firmen und Menschen selbst, was sie herstellen, kaufen und verkaufen. Es gibt privates Eigentum, Wettbewerb und freie Preise. Wer gute Produkte günstig anbietet, gewinnt Kunden. Der Markt hat aber Schwächen: Ohne Regeln können Monopole entstehen, die Umwelt kommt zu kurz, und wer nicht arbeiten kann, steht ohne Hilfe da. Fachleute sprechen von <b>Marktversagen</b>.', "In einer <b>Marktwirtschaft</b> entscheiden die Leute selbst, was sie herstellen und kaufen. Die Preise bilden sich von allein. Wer gute Sachen günstig verkauft, bekommt viele Kunden. Aber ganz ohne Regeln geht es nicht – sonst wird zum Beispiel die Umwelt verschmutzt."],
   ['Planwirtschaft','In einer <b>Planwirtschaft</b> legt eine staatliche Behörde fest, was hergestellt wird, wie viel davon und zu welchem Preis – oft in Fünfjahresplänen. Die Betriebe gehören dem Staat. So war es in der Sowjetunion und in der DDR. Das Problem: Keine Behörde weiß, was Millionen Menschen gerade brauchen. Und weil die Preise festgelegt sind, zeigen sie nicht an, wo etwas fehlt.', "In einer <b>Planwirtschaft</b> bestimmt der Staat, was hergestellt wird, wie viel und was es kostet. So war es zum Beispiel in der DDR. Das Problem: Niemand kann für Millionen Menschen planen, was sie brauchen. Darum fehlte oft etwas."],
   ['Alltag in der DDR','Brot, Mieten und Strom waren in der DDR sehr billig, weil der Staat viel dazuzahlte. Brot und Haferflocken kosteten teils weniger als Tierfutter – also verfütterten manche sie an Hühner und Kaninchen. Anderes fehlte: Auf einen neuen Pkw wartete man bis zu 18 Jahre, und für viele Waren stand man Schlange. Man nennt das <b>Mangelwirtschaft</b>.', "In der DDR waren Brot und Mieten sehr billig, weil der Staat dazubezahlte. Brot war sogar billiger als Tierfutter – darum bekamen manche Hühner Brot zu fressen! Auf ein neues Auto musste man dafür bis zu 18 Jahre warten."],
   ['Soziale Marktwirtschaft','Deutschland liegt dazwischen. Seit 1948 gilt die <b>Soziale Marktwirtschaft</b>, geprägt von Ludwig Erhard: Die Preise bilden sich grundsätzlich am Markt, aber der Staat setzt Regeln. Das Bundeskartellamt verhindert Monopole, es gibt Umweltgesetze, Sozialversicherungen, einen Mindestlohn und die Mietpreisbremse. Wie stark der Staat eingreifen soll, darüber wird bis heute gestritten.', "Deutschland hat eine <b>Soziale Marktwirtschaft</b>: Die Preise bilden sich meistens am Markt, aber der Staat passt auf. Er sorgt zum Beispiel dafür, dass keine Firma alles allein bestimmen kann, dass die Umwelt geschützt wird und dass Menschen Hilfe bekommen, wenn sie krank oder arbeitslos sind."],
   ['Wenn der Staat Preise festlegt','Ein <b>Höchstpreis</b> unter dem Marktpreis soll etwas billig machen. Dann wollen mehr Leute kaufen, aber weniger lohnt sich herzustellen – es wird knapp. Ein <b>Mindestpreis</b> über dem Marktpreis bewirkt das Gegenteil: Es wird mehr hergestellt als gekauft. Weil die Europäische Gemeinschaft Bauern feste Abnahmepreise garantierte, entstanden in den 1970er- und 80er-Jahren riesige „Butterberge“ und „Milchseen“.', "Legt der Staat einen Preis fest, kann das schiefgehen. Ist der Preis zu niedrig, wollen alle kaufen, aber kaum jemand will verkaufen – dann wird es knapp. Ist er zu hoch, bleibt viel übrig. Vor etwa 40 Jahren lagen in Europa deshalb riesige „Butterberge“ in den Lagerhallen."]
  ],
  fact:'Am 20. Juni 1948 kam die D-Mark, und Ludwig Erhard gab viele Preise frei. Am nächsten Tag waren die Schaufenster plötzlich voll: Händler hatten Waren zurückgehalten, weil sie für die alte Reichsmark nichts bekommen hätten. Die Preise stiegen danach allerdings kräftig.',
  quiz:[
   ['Viele wollen etwas kaufen, aber es gibt nur wenig davon. Was passiert meist mit dem Preis?',['Er sinkt','Er steigt','Er bleibt gleich','Die Ware wird verboten'],1,'Knappheit plus hohe Nachfrage treibt den Preis nach oben.'],
   ['Wer bestimmt in einer Planwirtschaft, was und wie viel hergestellt wird?',['Die Käufer','Eine staatliche Planbehörde','Die Börse','Niemand'],1,'Der Staat plant Mengen und Preise – oft für fünf Jahre im Voraus.', ["Wer entscheidet in einer Marktwirtschaft, was hergestellt wird?", ["Ein einziger Chef im Staat", "Die Firmen und Käufer selbst", "Der Zufall", "Die Schule"], 1, "Firmen stellen her, was Leute kaufen wollen – die Preise zeigen es ihnen."]],
   ['Der Staat legt einen Höchstpreis unter dem Marktpreis fest. Was ist die typische Folge?',['Es bleibt viel übrig','Knappheit und Warteschlangen','Alles wird besser und billiger','Nichts'],1,'Mehr Leute wollen kaufen, weniger lohnt sich herzustellen.', ["Wie lange musste man in der DDR auf ein neues Auto warten?", ["Eine Woche", "Ein Jahr", "Bis zu 18 Jahre", "Gar nicht"], 2, "Autos waren knapp – die Wartelisten waren endlos."]],
   ['Wie heißt die Wirtschaftsordnung in Deutschland?',['Planwirtschaft','Soziale Marktwirtschaft','Tauschwirtschaft','Marktwirtschaft ganz ohne Regeln'],1,'Freie Preise, aber mit Regeln und sozialer Absicherung.', ["Brot war in der DDR billiger als Tierfutter. Was passierte?", ["Alle aßen mehr Gemüse", "Manche fütterten ihre Hühner mit Brot", "Brot wurde verboten", "Nichts"], 1, "Wenn Preise nicht stimmen, machen Menschen seltsame Dinge."]]
  ]},
{ id:'gold',
  src:[["Wikipedia: Lydien", "https://de.wikipedia.org/wiki/Lydien"], ["Wikipedia: Kroisos", "https://de.wikipedia.org/wiki/Kroisos"], ["World Gold Council: Above-ground stocks (englisch)", "https://www.gold.org/goldhub/data/above-ground-stocks"], ["Wikipedia: Taler", "https://de.wikipedia.org/wiki/Taler"], ["Wikipedia: Denar", "https://de.wikipedia.org/wiki/Denar"], ["Wikipedia: Solidus", "https://de.wikipedia.org/wiki/Solidus"], ["Wikipedia: Solidus (englisch)", "https://en.wikipedia.org/wiki/Solidus_(coin)"], ["Wikipedia: Dukat", "https://de.wikipedia.org/wiki/Dukat"], ["Wikipedia: Goldstandard", "https://de.wikipedia.org/wiki/Goldstandard"], ["Wikipedia: Bretton-Woods-System", "https://de.wikipedia.org/wiki/Bretton-Woods-System"], ["Wikipedia: Nixon-Schock", "https://de.wikipedia.org/wiki/Nixon-Schock"], ["Wikipedia: Unze", "https://de.wikipedia.org/wiki/Unze"], ["Wikipedia: Bimetallism – Gold-Silber-Verhältnis früher (englisch)", "https://en.wikipedia.org/wiki/Bimetallism"], ["Wikipedia: Silver as an investment – Gold-Silber-Verhältnis heute (englisch)", "https://en.wikipedia.org/wiki/Silver_as_an_investment"]], name:'Goldmine', topic:'Die Geschichte von Gold und Silber',
  moni:'Gold glänzt, das weiß ich. Aber warum haben sich ausgerechnet Gold und Silber als Geld durchgesetzt?',
  cards:[
   ['Die ersten Münzen','Um 600 v. Chr. prägte man in Lydien (heute Westtürkei) die ersten bekannten Münzen – aus Elektron, einer natürlichen Mischung aus Gold und Silber. König Krösus ließ dann Münzen aus reinem Gold und reinem Silber schlagen. Daher kommt „reich wie Krösus“.', "Vor über 2.600 Jahren gab es in Lydien (heute in der Türkei) die ersten Münzen. König Krösus war dort so reich, dass man bis heute sagt: „reich wie Krösus“."],
   ['Warum gerade Gold?','Gold rostet nicht, ist selten, lässt sich teilen und formen und sieht schön aus. Bis Ende 2025 wurden laut World Gold Council rund <b>220.700 Tonnen</b> gefördert – zusammengeschmolzen ein Würfel von gut 22 Metern Kantenlänge. Fast alles davon existiert noch.', "Gold rostet nicht, ist selten und glänzt schön. Alles Gold, das Menschen je aus der Erde geholt haben, passt in einen Würfel, der etwa so hoch ist wie ein Haus mit sieben Stockwerken."],
   ['Silber für den Alltag','Für kleine Einkäufe war Silber oft wichtiger: der römische Denar, der Pfennig, das englische Pfund (ursprünglich ein Pfund Silber). Ab 1520 prägte man im böhmischen Joachimsthal den „Joachimsthaler“ – kurz Taler. Daraus wurde das Wort <b>Dollar</b>.', "Für kleine Einkäufe gab es Silbermünzen. Eine berühmte hieß „Taler“. Aus diesem Wort wurde später <b>Dollar</b>."],
   ['Die erste Inflation','Römische Kaiser mischten immer mehr Kupfer in den Denar, um mehr Münzen aus demselben Silber zu machen. Im 3. Jahrhundert steckte kaum noch Silber drin. Mehr Münzen, weniger Wert – die Preise stiegen. Das Prinzip hat sich bis heute nicht geändert.', "Römische Kaiser mischten immer mehr billiges Kupfer in ihre Silbermünzen, um mehr Münzen zu machen. Die Leute merkten das – und die Preise stiegen. Mehr Geld, das weniger wert ist: Das nennt man <b>Inflation</b>."],
   ['Die stabilste Münze der Geschichte','Um 312 n. Chr. führte Kaiser Konstantin eine neue Goldmünze ein: den <b>Solidus</b> mit rund 4,5 Gramm Gold. Etwa 700 Jahre lang blieb er fast genau gleich schwer und rein – kaum eine Münze hat das je geschafft. Warum? Nur der Kaiser durfte ihn prägen, jeder konnte das Gewicht nachprüfen, und Steuern wurden in Gold bezahlt. Erst als der Staat im 11. Jahrhundert Geld brauchte, kam weniger Gold hinein – und das Vertrauen ging verloren. Fast so lange hielt der <b>Dukat</b> aus Venedig: von 1284 bis 1797.', "Vor etwa 1.700 Jahren ließ ein römischer Kaiser eine Goldmünze prägen: den <b>Solidus</b>. 700 Jahre lang steckte darin immer gleich viel Gold. Darum vertrauten ihm die Menschen – sogar in fernen Ländern. Erst als der Staat Geld brauchte, mischte er weniger Gold hinein."],
   ['Papier mit Goldversprechen','Im 19. Jahrhundert banden viele Länder ihr Papiergeld an Gold (das Deutsche Reich ab 1871/73). Eine Banknote war ein Versprechen: Diesen Schein kannst du bei der Notenbank gegen Gold tauschen.', "Später gab es Papiergeld. Jeder Schein war ein Versprechen: Diesen Schein kannst du bei der Bank gegen Gold eintauschen."],
   ['Das Ende der Goldbindung','1944 wurde in Bretton Woods beschlossen: Der Dollar ist an Gold gebunden (35 $ je Unze), die anderen Währungen an den Dollar. Am 15. August 1971 beendete US-Präsident Nixon den Goldumtausch. Seitdem ist keine große Währung mehr durch Gold gedeckt.', "Seit 1971 kann man Dollar nicht mehr gegen Gold tauschen. Hinter keinem großen Geld steckt heute noch Gold – sondern Vertrauen."],
   ['Gewicht in Feinunzen','Edelmetalle werden in Feinunzen gehandelt: 1 Feinunze = 31,1035 Gramm reines Metall. Achtung: Die normale Unze aus dem Alltag wiegt nur 28,35 Gramm.', null]
  ],
  fact:'Das Verhältnis von Gold zu Silber lag in Antike und Mittelalter oft bei etwa 1:12 bis 1:15. Heute muss man meist 50 bis 100 Unzen Silber für eine Unze Gold zahlen.',
  quiz:[
   ['Wo entstanden um 600 v. Chr. die ersten bekannten Münzen aus Edelmetall?',['In Ägypten','In Lydien','In Rom','In Skandinavien'],1,'In Lydien – Krösus war dort König.'],
   ['Woher kommt das Wort „Dollar“?',['Vom „Joachimsthaler“, einer böhmischen Silbermünze','Von „Dolly“, einem Spitznamen','Vom englischen „dull“','Aus dem Spanischen „dolor“'],0,'Joachimsthaler → Taler → Dollar.'],
   ['Was geschah am 15. August 1971?',['Der Euro wurde eingeführt','Die USA beendeten den Umtausch von Dollar in Gold','Gold wurde verboten','Die erste Börse eröffnete'],1,'Damit endete das System von Bretton Woods.', ["Was steckt heute hinter Dollar und Euro?", ["Gold", "Silber", "Vertrauen", "Kühe"], 2, "Seit 1971 ist kein großes Geld mehr an Gold gebunden."]],
   ['Wie viel wiegt eine Feinunze?',['28,35 g','31,1 g','100 g','1 kg'],1,'31,1035 Gramm. Die 28,35 g sind die gewöhnliche Unze.', ["Warum war Gold so beliebt als Geld?", ["Weil es leicht ist", "Weil es nicht rostet und selten ist", "Weil man es essen kann", "Weil es überall herumliegt"], 1, "Gold hält ewig und ist knapp – perfekt, um Wert aufzubewahren."]]
  ]},
{ id:'bank',
  src:[["Wikipedia: Bankrott", "https://de.wikipedia.org/wiki/Bankrott"], ["Wikipedia: Monte dei Paschi di Siena", "https://de.wikipedia.org/wiki/Banca_Monte_dei_Paschi_di_Siena"], ["Wikipedia: Einlagensicherung", "https://de.wikipedia.org/wiki/Einlagensicherung"], ["Wikipedia: Bankansturm", "https://de.wikipedia.org/wiki/Bankansturm"], ["Wikipedia: Zentralbank", "https://de.wikipedia.org/wiki/Zentralbank"]], name:'Die Bank', topic:'Was Banken eigentlich machen',
  moni:'Mein Geld liegt auf der Bank. Aber was macht die Bank damit, während ich nicht hinschaue?',
  cards:[
   ['Ein Tisch und ein Bruch','„Bank“ kommt vom italienischen <i>banco</i>, dem Tisch der Geldwechsler im Mittelalter. Konnte ein Wechsler nicht zahlen, wurde sein Tisch zerschlagen: <i>banca rotta</i> – daraus wurde „bankrott“.'],
   ['Alte Bankhäuser','Die Medici in Florenz und die Fugger in Augsburg finanzierten Päpste und Kaiser. Die älteste heute noch tätige Bank ist die Monte dei Paschi di Siena, gegründet 1472.', null],
   ['Das Geschäft der Bank','Banken führen Konten, wickeln Zahlungen ab, vergeben Kredite und legen Geld an. Sie verdienen vor allem an der <b>Zinsdifferenz</b>: Für Kredite nehmen sie mehr Zinsen, als sie Sparern zahlen. Dazu kommen Gebühren.', "Banken passen auf dein Geld auf, überweisen es und verleihen Geld. Wer sich Geld leiht, zahlt dafür <b>Zinsen</b>. Wer spart, bekommt Zinsen – aber weniger. Den Unterschied behält die Bank."],
   ['Zwei Sorten Banken','Du hast dein Konto bei einer <b>Geschäftsbank</b> – Sparkasse, Volksbank, Direktbank. Die Geschäftsbanken haben wiederum Konten bei der <b>Zentralbank</b>. Für den Euro ist das die Europäische Zentralbank (EZB) mit den nationalen Notenbanken, in Deutschland die Bundesbank.', "Deine Bank ist zum Beispiel die Sparkasse. Und auch Banken haben eine Bank: die <b>Zentralbank</b>. Für den Euro ist das die Europäische Zentralbank (EZB) in Frankfurt."],
   ['Wenn eine Bank pleitegeht','In der EU sind Guthaben bis <b>100.000 € pro Person und Bank</b> gesetzlich geschützt (Einlagensicherung). Wertpapiere im Depot gehören ohnehin dir und nicht der Bank.', "Geht eine Bank pleite, ist dein Geld trotzdem sicher – bis 100.000 €. Das steht im Gesetz."],
   ['Der Bank Run','Wollen alle Kunden gleichzeitig ihr Geld abheben, hat keine Bank genug Bargeld da – denn das meiste Geld existiert nur als Zahl auf Konten. Beispiele: Deutschland 1931, Northern Rock in England 2007, Silicon Valley Bank in den USA 2023.', "Wenn alle Kunden gleichzeitig ihr Geld abholen wollen, hat die Bank nicht genug Scheine im Tresor. Denn das meiste Geld ist nur eine Zahl im Computer. Das nennt man <b>Bank Run</b>."]
  ],
  fact:'Die Einlagensicherung gilt pro Bank. Wer mehr als 100.000 € hat, kann das Geld auf mehrere Banken verteilen.',
  quiz:[
   ['Woher kommt das Wort „bankrott“?',['Von <i>banca rotta</i> – der zerbrochene Tisch','Von „Bank“ und „rot“ wie rote Zahlen','Vom Bankräuber Rott','Vom englischen „bank route“'],0,'Der Tisch eines zahlungsunfähigen Wechslers wurde zerschlagen.'],
   ['Bis zu welchem Betrag sind Bankguthaben in der EU gesetzlich gesichert?',['10.000 €','100.000 €','1 Million €','Unbegrenzt'],1,'100.000 € pro Person und Bank.'],
   ['Womit verdienen Banken klassisch ihr Geld?',['Mit dem Drucken von Banknoten','Mit der Zinsdifferenz zwischen Krediten und Sparzinsen','Mit Steuern','Mit dem Verkauf von Tresoren'],1,'Kreditzins minus Sparzins – das ist die Marge der Bank.'],
   ['Wo haben Geschäftsbanken ihr Konto?',['Bei der Zentralbank','Beim Finanzamt','Bei der Börse','Nirgends'],0,'Darüber laufen auch Überweisungen zwischen verschiedenen Banken.']
  ]},
{ id:'schoepfung',
  src:[["Deutsche Bundesbank: Monatsbericht April 2017 – Geldschöpfungsprozess (PDF)", "https://www.bundesbank.de/resource/blob/654284/df66c4444d065a7f519e2ab0c476df58/mL/2017-04-monatsbericht-data.pdf"], ["Bank of England: Money creation in the modern economy, 2014 (englisch)", "https://www.bankofengland.co.uk/quarterly-bulletin/2014/q1/money-creation-in-the-modern-economy"], ["Wikipedia: Geldschöpfung", "https://de.wikipedia.org/wiki/Geldschöpfung"], ["Wikipedia: Mindestreserve", "https://de.wikipedia.org/wiki/Mindestreserve"], ["Art. 123 AEUV (Verbot der Staatsfinanzierung)", "https://dejure.org/gesetze/AEUV/123.html"]], name:'Geldmaschine', topic:'Wie Geld entsteht', extra:'maschine',
  moni:'Ich dachte immer, Geld wird gedruckt. Stimmt das überhaupt?',
  cards:[
   ['Zwei Arten von Geld','<b>Zentralbankgeld</b>: Bargeld und die Guthaben der Banken bei der Zentralbank. <b>Buchgeld</b>: das Guthaben auf deinem Girokonto. Buchgeld ist der weitaus größte Teil – von sieben Euro, mit denen im Euroraum täglich bezahlt werden kann, ist nur etwa einer Bargeld.', "Es gibt Geld zum Anfassen: <b>Bargeld</b>. Und Geld als Zahl auf dem Konto: <b>Buchgeld</b>. Von sieben Euro ist nur ungefähr einer Bargeld – der Rest ist eine Zahl im Computer."],
   ['Ein Kredit erschafft Geld','Wenn eine Bank dir einen Kredit gibt, schreibt sie dir den Betrag einfach auf dein Konto. Sie nimmt das Geld nicht anderen Sparern weg – es entsteht in diesem Moment neu. So beschreiben es die Bundesbank (2017) und die Bank of England (2014).', "Leiht dir eine Bank Geld, schreibt sie die Zahl einfach auf dein Konto. Sie nimmt das Geld niemand anderem weg – es entsteht in diesem Moment neu. Klingt wie Zauberei, ist aber so."],
   ['Tilgen lässt Geld verschwinden','Zahlst du den Kredit zurück, verschwindet das Buchgeld wieder. Fast jeder Euro auf einem Konto steht also irgendwo einer Schuld gegenüber.', "Zahlst du das geliehene Geld zurück, verschwindet es wieder. Fast jeder Euro auf einem Konto gehört also zu einer Schuld von irgendwem."],
   ['Warum Banken nicht unendlich Geld machen','Banken brauchen genug <b>Eigenkapital</b> (Regeln nach Basel III), müssen <b>1 % Mindestreserve</b> bei der Zentralbank halten und brauchen Kunden, die einen Kredit zurückzahlen können. Und die Zentralbank bestimmt mit dem Leitzins, wie teuer das Ganze ist.', "Banken dürfen nicht unbegrenzt Geld verleihen. Es gibt strenge Regeln, und sie verleihen nur an Leute, die das Geld wahrscheinlich zurückzahlen können."],
   ['Und das Bargeld?','Die Bundesbank lässt Banknoten im Auftrag der EZB drucken. In Umlauf kommen sie, wenn du am Automaten abhebst: Dein Buchgeld wird gegen Scheine getauscht. Mehr Geld entsteht dabei nicht.', "Die Scheine werden gedruckt. Hebst du am Automaten Geld ab, wird die Zahl auf deinem Konto kleiner und du bekommst Scheine. Mehr Geld hast du dadurch nicht."],
   ['Und der Staat?','Staaten finanzieren sich über Steuern und Anleihen. Die EZB darf Staaten nicht direkt Geld leihen (Verbot der monetären Staatsfinanzierung, Art. 123 EU-Vertrag). Sie kauft aber zeitweise Staatsanleihen am Markt.', null]
  ],
  fact:'Der berühmte Satz „Banken verleihen das Geld der Sparer“ steht noch in vielen Schulbüchern. Die Bundesbank hat ihn 2017 ausdrücklich als zu einfach bezeichnet.',
  quiz:[
   ['Was passiert, wenn eine Bank einen Kredit vergibt?',['Sie nimmt das Geld von anderen Sparern','Es entsteht neues Buchgeld','Die Bundesbank druckt neue Scheine','Der Staat zahlt das Geld aus'],1,'Der Kreditbetrag wird gutgeschrieben – neues Buchgeld.'],
   ['Was passiert, wenn der Kredit zurückgezahlt wird?',['Das Buchgeld verschwindet wieder','Das Geld geht an den Staat','Es wird in Gold getauscht','Nichts'],0,'Kreditschöpfung und Tilgung sind zwei Seiten derselben Buchung.'],
   ['Welcher Teil des Geldes ist der größte?',['Bargeld','Buchgeld auf Konten','Münzen','Gold der Zentralbank'],1,'Etwa sechs von sieben Euro sind Buchgeld.'],
   ['Wie hoch ist die Mindestreserve im Euroraum?',['0 %','1 %','10 %','50 %'],1,'Seit 2012 sind es 1 % bestimmter Einlagen.', ["Was ist Buchgeld?", ["Geld, das in Büchern liegt", "Geld als Zahl auf dem Konto", "Ein Buch über Geld", "Münzen"], 1, "Buchgeld steht auf Konten – es ist der größte Teil des Geldes."]]
