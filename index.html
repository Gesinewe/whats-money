{ id:'system',
  src:[["Wikipedia: Fiatgeld", "https://de.wikipedia.org/wiki/Fiatgeld"], ["Wikipedia: Euro", "https://de.wikipedia.org/wiki/Euro"], ["Wikipedia: Eurozone", "https://de.wikipedia.org/wiki/Eurozone"], ["Wikipedia: Deutsche Euromünzen", "https://de.wikipedia.org/wiki/Deutsche_Euromünzen"], ["EZB: Leitzinsen (englisch)", "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html"], ["Destatis: Inflationsrate August 2026", "https://www.destatis.de/DE/Presse/Pressemitteilungen/2026/09/PD26_320_611.html"], ["Wikipedia: Deutsche Inflation 1914 bis 1923", "https://de.wikipedia.org/wiki/Deutsche_Inflation_1914_bis_1923"], ["Wikipedia: Rentenmark", "https://de.wikipedia.org/wiki/Rentenmark"], ["Wikipedia: Deflation", "https://de.wikipedia.org/wiki/Deflation"], ["Bordo, Landon-Lane, Redish: Good versus Bad Deflation, NBER 2004 (englisch)", "https://www.nber.org/papers/w10329"], ["Federal Reserve Bank of St. Louis: Die Weltwirtschaftskrise in Zahlen (englisch)", "https://www.stlouisfed.org/the-great-depression/curriculum/economic-episodes-in-american-history-part-3"], ["Federal Reserve Bank of St. Louis: Why 2 Percent? (englisch)", "https://www.stlouisfed.org/open-vault/2019/january/fed-inflation-target-2-percent"]], name:'Zentralbank', topic:'Das Geldsystem, Inflation und Zinsen',
  easy:{ fact:'Die Euro-Scheine sehen in allen 21 Ländern gleich aus. Die Münzen zeigen auf einer Seite ein Motiv aus ihrem Land – in Deutschland den Bundesadler, das Brandenburger Tor oder einen Eichenzweig.' },
  moni:'Wenn Geld nicht mehr an Gold hängt – woran hängt es dann? Und warum wird alles immer teurer?',
  cards:[
   ['Fiatgeld','„Fiat“ ist Latein und heißt „es werde“. Der Euro ist durch nichts gedeckt außer Vertrauen und Gesetz: Er ist gesetzliches Zahlungsmittel, und Steuern werden in Euro bezahlt. Darum will ihn jeder haben.', "„Fiat“ ist Latein und heißt „es werde“. Hinter dem Euro steckt kein Gold. Er funktioniert, weil alle ihm vertrauen und weil das Gesetz sagt: Damit wird bezahlt."],
   ['Der Euro','Seit 1. Januar 1999 als Buchgeld, seit 1. Januar 2002 als Bargeld. Umtauschkurs: 1 € = 1,95583 DM. Seit Bulgarien am 1. Januar 2026 beigetreten ist, zahlen <b>21</b> EU-Länder mit dem Euro.', "Seit 2002 gibt es Euro-Scheine und -Münzen. Heute bezahlen <b>21</b> Länder in Europa damit."],
   ['Die Aufgabe der EZB','Die EZB soll die Preise stabil halten – Ziel ist eine Inflation von <b>2 %</b> auf mittlere Sicht. Ihr wichtigstes Werkzeug ist der Leitzins. Steigt er, werden Kredite teurer, es wird weniger gekauft, die Inflation sinkt. Am 10. September 2026 hat die EZB den Einlagezins auf 2,50 % erhöht.', "Die EZB passt auf, dass die Preise nur langsam steigen – ungefähr 2 % pro Jahr. Ihr Werkzeug ist der <b>Leitzins</b>: Ist er hoch, wird Geldleihen teurer, die Leute kaufen weniger, und die Preise steigen langsamer."],
   ['Inflation frisst Kaufkraft','Steigen die Preise, kannst du dir für dasselbe Geld weniger kaufen. Bei 2 % Inflation halbiert sich die Kaufkraft in etwa 35 Jahren. In Deutschland lag die Inflation im August 2026 bei 2,9 %.', ["Alles wird teurer", "<b>Inflation</b> heißt: Die Preise steigen. Ein Eis, das heute 1,50 € kostet, kostet in ein paar Jahren vielleicht 2 €. Für dasselbe Geld bekommst du dann weniger."]],
   ['Hyperinflation 1923','Im November 1923 kostete ein US-Dollar in Deutschland 4,2 Billionen Mark. Löhne wurden täglich ausgezahlt und sofort ausgegeben. Erst die Rentenmark beendete das Chaos: 1 Rentenmark = 1 Billion Papiermark.', "1923 wurde in Deutschland das Geld fast jeden Tag weniger wert. Am Ende kostete ein Brot Milliarden Mark! Kinder spielten mit Bündeln von Geldscheinen wie mit Bauklötzen."],
   ['Wenn Preise fallen','Sinken die Preise über längere Zeit, heißt das <b>Deflation</b>. Das ist nicht immer schlimm. Im 19. Jahrhundert fielen die Preise oft, weil Fabriken, Maschinen und Eisenbahnen vieles billiger machten – und die Wirtschaft wuchs trotzdem. Fachleute nennen das „gute“ Deflation: Es gibt mehr Waren, und darum werden sie billiger.', "Wenn Preise über lange Zeit sinken, heißt das <b>Deflation</b>. Das kann gut sein: Vor 150 Jahren wurde vieles billiger, weil Maschinen die Dinge schneller herstellen konnten."],
   ['Die gefährliche Abwärtsspirale','Schlimm wird es, wenn die Preise fallen, weil die Leute weniger kaufen. Dann verdienen Firmen weniger und entlassen Menschen – die kaufen dann noch weniger. Wer Schulden hat, verdient weniger, muss aber genauso viel zurückzahlen wie vorher. In der Weltwirtschaftskrise sanken die Preise in den USA von 1929 bis 1933 um etwa ein Viertel, die Wirtschaftsleistung um fast ein Drittel. Darum peilen Zentralbanken rund 2 % Inflation an statt 0 % – als Sicherheitsabstand.', "Schlimm wird es, wenn Preise sinken, weil niemand mehr etwas kauft. Dann verdienen Firmen weniger und müssen Leute entlassen. Die haben dann noch weniger Geld zum Einkaufen – ein Teufelskreis. Darum sollen die Preise lieber ein kleines bisschen steigen: etwa 2 % im Jahr."]
  ],
  fact:'Mit der Rentenmark von 1923 hatte Deutschland zum ersten Mal Geld, das durch Grundbesitz „gedeckt“ sein sollte – in Wahrheit wirkte es, weil die Menge streng begrenzt war und die Leute wieder Vertrauen fassten.',
  quiz:[
   ['Was bedeutet „fiat“?',['Es werde','Gold','Vertrauen','Auto'],0,'Fiatgeld gilt, weil es zum Geld erklärt wurde – nicht, weil es an etwas gebunden ist.'],
   ['Welche Inflationsrate strebt die EZB mittelfristig an?',['0 %','2 %','5 %','10 %'],1,'2 % gilt als stabil genug und lässt Abstand zur Deflation.'],
   ['Was bewirkt ein höherer Leitzins in der Regel?',['Kredite werden billiger','Kredite werden teurer, die Inflation sinkt','Es wird mehr Bargeld gedruckt','Gold wird teurer'],1,'Teurere Kredite bremsen Nachfrage und damit den Preisauftrieb.', ["Was bedeutet Inflation?", ["Alles wird billiger", "Alles wird teurer", "Das Geld wird gelöscht", "Die Bank macht zu"], 1, "Steigen die Preise, bekommst du für dein Geld weniger."]],
   ['Was kostete ein US-Dollar im November 1923 in Deutschland?',['4,20 Mark','4.200 Mark','4,2 Millionen Mark','4,2 Billionen Mark'],3,'Eine Zahl mit 12 Nullen – Hyperinflation.', ["Wie viel kostete 1923 am Ende ein Brot?", ["1 Mark", "100 Mark", "Milliarden Mark", "Gar nichts"], 2, "Das Geld war fast nichts mehr wert – das nennt man Hyperinflation."]]
  ]},
{ id:'zins',
  src:[["Wikipedia: Zinseszins und 72er-Regel", "https://de.wikipedia.org/wiki/Zinseszins"], ["Wikipedia: Weizenkornlegende", "https://de.wikipedia.org/wiki/Weizenkornlegende"], ["Quote Investigator: Das Einstein-Zitat zum Zinseszins (englisch)", "https://quoteinvestigator.com/2011/10/31/compound-interest/"], ["Beispiele mit Anna, Ben und 1.000 €: eigene Rechnung mit 7 % pro Jahr", null]], name:'Zinseszins-Garten', topic:'Wie Geld von allein wächst', extra:'zins',
  moni:'Jetzt wird es spannend: Wie kann mein Geld eigentlich wachsen, ohne dass ich etwas tue?',
  cards:[
   ['Zins ist ein Preis','Der Zins ist der Preis fürs Leihen. Wer Geld verleiht oder spart, bekommt Zinsen. Wer sich Geld leiht, zahlt sie.'],
   ['Zinsen auf Zinsen','Beim Zinseszins werden die Zinsen nicht ausgezahlt, sondern mitverzinst. Die Formel: <b>Endbetrag = Start × (1 + Zins)<sup>Jahre</sup></b>. Das Wachstum wird dadurch mit jedem Jahr schneller.', "Beim Zinseszins bekommst du Zinsen – und im nächsten Jahr auch Zinsen auf diese Zinsen. Dein Geld wächst wie ein Schneeball, der den Berg hinunterrollt: erst langsam, dann immer schneller."],
   ['Ein Beispiel','1.000 € zu 7 % pro Jahr: nach 10 Jahren 1.967 €, nach 30 Jahren 7.612 €, nach 40 Jahren 14.974 €. In den letzten zehn Jahren kommt mehr dazu als in den ersten dreißig zusammen.'],
   ['Die 72er-Regel','Teile 72 durch den Zinssatz – dann weißt du ungefähr, nach wie vielen Jahren sich dein Geld verdoppelt. Bei 6 % sind das 12 Jahre, bei 9 % 8 Jahre.'],
   ['Früh anfangen schlägt viel einzahlen','Anna spart von 25 bis 35 jedes Jahr 2.000 € und zahlt danach nichts mehr ein, lässt das Geld aber angelegt (20.000 € eingezahlt). Ben spart von 35 bis 65 jedes Jahr 2.000 € (60.000 €). Bei 7 % hat Anna mit 65 rund <b>210.000 €</b>, Ben nur rund <b>189.000 €</b> – mit dreimal so viel eingezahltem Geld.', "Anna legt ab 25 zehn Jahre lang jedes Jahr 2.000 € an. Danach zahlt sie nichts mehr ein – aber ihr Geld bleibt angelegt und wächst mit Zinseszins von allein weiter. Ben fängt erst mit 35 an, also genau dann, als Anna aufhört einzuzahlen. Er zahlt 30 Jahre lang jedes Jahr 2.000 € ein – dreimal so viel wie Anna. Trotzdem hat Anna mit 65 mehr: rund <b>210.000 €</b>, Ben rund <b>189.000 €</b>. Annas Geld hatte zehn Jahre mehr Zeit zum Wachsen – und beim Zinseszins kommt in den letzten Jahren am meisten dazu."],
   ['Funktioniert auch rückwärts','Bei Schulden arbeitet der Zinseszins gegen dich. Schulden mit 18 % Zinsen verdoppeln sich in nur vier Jahren, wenn man nichts zurückzahlt.'],
   ['Ein falsches Zitat','Albert Einstein soll gesagt haben, der Zinseszins sei die größte Kraft im Universum. Belegt ist das nirgends – das Zitat wurde ihm erst Jahrzehnte nach seinem Tod zugeschrieben.']
  ],
  fact:'Die Legende vom Schachbrett: Ein Weiser wünscht sich ein Reiskorn auf dem ersten Feld und auf jedem weiteren doppelt so viele. Auf dem 64. Feld lägen über 9 Trillionen Körner – mehr Reis, als die Menschheit je geerntet hat.',
  quiz:[
   ['Nach wie vielen Jahren verdoppelt sich Geld bei 8 % Zinsen ungefähr?',['4 Jahre','9 Jahre','16 Jahre','72 Jahre'],1,'72 ÷ 8 = 9.'],
   ['Du legst 1.000 € zu 10 % an. Wie viel hast du nach 2 Jahren mit Zinseszins?',['1.200 €','1.210 €','1.100 €','2.000 €'],1,'1.000 × 1,1 × 1,1 = 1.210 €. Die 10 € extra sind die Zinsen auf die Zinsen.'],
   ['Wer hat im Beispiel mit 65 mehr Geld?',['Ben, er hat mehr eingezahlt','Anna, weil ihr Geld länger wachsen konnte','Beide gleich viel','Keiner, die Inflation frisst alles'],1,'Zeit ist beim Zinseszins wichtiger als die Höhe der Einzahlung.'],
   ['Was ist der Zinseszins?',['Ein Zins nur für Banken','Zinsen, die selbst wieder verzinst werden','Eine Strafgebühr','Der Zins der Zentralbank'],1,'Zinsen auf Zinsen.']
  ]},
{ id:'kredit',
  src:[["Wikipedia: Effektiver Jahreszins", "https://de.wikipedia.org/wiki/Effektiver_Jahreszins"], ["Wikipedia: Dispositionskredit", "https://de.wikipedia.org/wiki/Dispositionskredit"], ["Wikipedia: Annuitätendarlehen", "https://de.wikipedia.org/wiki/Annuitätendarlehen"], ["Wikipedia: Schufa", "https://de.wikipedia.org/wiki/Schufa"], ["Wikipedia: Privatinsolvenz", "https://de.wikipedia.org/wiki/Privatinsolvenz"], ["Verbraucherzentrale Hamburg: Schuldnerberatung hilft kostenlos", "https://www.vzhh.de/themen/schulden/schulden-was-tun-schuldnerberatung-hilft-kostenlos-weiter"], ["Wikipedia: Schuldenbremse", "https://de.wikipedia.org/wiki/Schuldenbremse_(Deutschland)"]], name:'Kreditbüro', topic:'Kredite und Schulden', extra:'kredit',
  moni:'Manchmal reicht das Geld nicht. Darf ich mir dann einfach welches leihen?',
  cards:[
   ['Was ein Kredit ist','Ein Kredit ist geliehenes Geld, für das du Zinsen zahlst. Es gibt Ratenkredite, den Dispokredit auf dem Girokonto, Baufinanzierungen, Kreditkarten und „Jetzt kaufen, später zahlen“-Angebote.', "Ein Kredit ist geliehenes Geld. Du bekommst es jetzt und zahlst es später zurück – und zwar mehr, als du bekommen hast. Das Extra sind die Zinsen."],
   ['Nur den Effektivzins vergleichen','Der <b>effektive Jahreszins</b> enthält alle Kosten des Kredits. Der Sollzins ist oft niedriger und sieht nur schöner aus. Banken müssen den Effektivzins angeben.', "Banken werben gern mit kleinen Zahlen. Wichtig ist der <b>effektive Jahreszins</b>: In ihm stecken alle Kosten. Nur so kann man Angebote fair vergleichen."],
   ['Der teure Dispo','Überziehst du dein Girokonto, zahlst du Dispozinsen – oft um die 10 bis 14 % im Jahr. Für ein paar Tage okay, als Dauerzustand eine der teuersten Arten, Geld zu leihen.', "Gibst du mehr aus, als auf dem Konto ist, rutschst du ins Minus. Das nennt man <b>Dispo</b> – und der ist richtig teuer."],
   ['Die Annuität','Bei den meisten Krediten zahlst du jeden Monat dieselbe Rate. Am Anfang besteht sie vor allem aus Zinsen, am Ende fast nur aus Tilgung. Je länger die Laufzeit, desto kleiner die Rate – aber desto mehr Zinsen insgesamt.', null],
   ['Gute und schlechte Schulden','Ein Kredit kann sinnvoll sein, wenn er etwas finanziert, das Wert schafft oder Einkommen bringt: eine Ausbildung, Werkzeug für die Selbstständigkeit, eine vermietete Wohnung. Für Dinge, die schnell an Wert verlieren – Urlaub, Handy, Möbel auf Raten –, macht ein Kredit sie nur teurer.', "Für manche Dinge kann sich ein Kredit lohnen, zum Beispiel für eine Ausbildung, die später mehr Geld bringt. Für Dinge, die schnell kaputt oder verbraucht sind – Handy, Urlaub, Turnschuhe –, macht ein Kredit sie nur teurer."],
   ['Schufa','Die Schufa speichert, welche Kredite und Verträge du hast und ob du pünktlich zahlst. Daraus berechnet sie einen Score. Er entscheidet mit, ob du einen Kredit oder Handyvertrag bekommst und zu welchem Zins.', "Die Schufa merkt sich, ob Leute ihre Rechnungen pünktlich bezahlen. Wer oft zu spät zahlt, bekommt später schwerer einen Kredit oder Handyvertrag."],
   ['Raus aus der Schuldenfalle','Wer neue Kredite aufnimmt, um alte zu bezahlen, rutscht in die Schuldenfalle. Kostenlose Hilfe gibt es bei Schuldnerberatungen von Verbraucherzentralen, Caritas oder Diakonie. Als letzter Weg bleibt die Privatinsolvenz; die Restschuldbefreiung gibt es heute meist nach drei Jahren.', "Wer neue Schulden macht, um alte zu bezahlen, sitzt in der Schuldenfalle. Dann hilft eine Schuldnerberatung – kostenlos."],
   ['Staaten sind keine Haushalte','Ein Staat zahlt seine Schulden selten ganz zurück. Er ersetzt fällige Anleihen durch neue. Entscheidend ist, ob er die Zinsen tragen kann. In Deutschland begrenzt die Schuldenbremse im Grundgesetz seit 2009 die Neuverschuldung; 2025 wurde sie für Verteidigung gelockert.', null]
  ],
  fact:'Das Wort „Kredit“ kommt vom lateinischen <i>credere</i> – glauben, vertrauen. Wer Kredit gibt, glaubt daran, das Geld zurückzubekommen.',
  quiz:[
   ['Welchen Zins solltest du beim Vergleich von Krediten anschauen?',['Den Sollzins','Den effektiven Jahreszins','Den Leitzins','Den Sparzins'],1,'Nur der Effektivzins enthält alle Kosten.'],
   ['Woraus besteht die Rate eines Annuitätenkredits am Anfang vor allem?',['Aus Tilgung','Aus Zinsen','Aus Gebühren','Aus Steuern'],1,'Die Restschuld ist anfangs am höchsten, also auch die Zinsen.', ["Was ist ein Dispo?", ["Ein Sparbuch", "Ein Minus auf dem Girokonto", "Ein Geschenk der Bank", "Eine Münze"], 1, "Der Dispo ist teuer – am besten schnell wieder ausgleichen."]],
   ['Was passiert bei längerer Laufzeit desselben Kredits?',['Kleinere Rate, aber mehr Zinsen insgesamt','Größere Rate, weniger Zinsen','Alles bleibt gleich','Der Kredit wird zinsfrei'],0,'Länger leihen kostet länger Zinsen.', ["Wofür lohnt sich ein Kredit eher?", ["Für einen Urlaub", "Für neue Turnschuhe", "Für eine Ausbildung", "Für Süßigkeiten"], 2, "Eine Ausbildung bringt später mehr Einkommen – Turnschuhe nicht."]],
   ['Woher kommt das Wort „Kredit“?',['Von <i>credere</i> – glauben, vertrauen','Von „Kreide“, weil man anschrieb','Von „Credit Card“','Aus dem Griechischen für „Schuld“'],0,'Wer leiht, vertraut. Das Anschreiben mit Kreide ist eine schöne Geschichte, aber nicht die Herkunft.']
  ]},
{ id:'konsum',
  src:[["Wikipedia: Opportunitätskosten", "https://de.wikipedia.org/wiki/Opportunitätskosten"], ["Wikipedia: Sparquote", "https://de.wikipedia.org/wiki/Sparquote"], ["ING Wissen: Notgroschen", "https://www.ing.de/wissen/notgroschen"], ["Kaffee- und Süßigkeiten-Beispiel: eigene Rechnung", null]], name:'Einkaufsstraße', topic:'Konsum oder Investition?', extra:'sortieren',
  moni:'Neue Turnschuhe oder Aktien? Wie entscheide ich, wofür mein Geld da ist?',
  cards:[
   ['Konsum','Konsum ist Geld für etwas, das du verbrauchst: Essen, Kino, Kleidung, Urlaub. Konsum ist nötig und darf Freude machen. Es geht nicht darum, nichts auszugeben, sondern bewusst.'],
   ['Investition','Eine Investition ist Geld für etwas, das dir später Geld oder Nutzen bringt: Aktien, eine Weiterbildung, Werkzeug für einen Nebenjob, eine vermietete Wohnung.'],
   ['Was Geld bringt und was Geld kostet','Ein Vermögenswert bringt Geld herein. Eine Verbindlichkeit zieht jeden Monat Geld ab. Ein Auto kostet Versicherung, Steuer, Sprit, Reparaturen und verliert an Wert – auch wenn man es „besitzt“.', "Manche Dinge bringen dir Geld, andere kosten dich jeden Monat Geld. Ein Auto zum Beispiel kostet Versicherung, Sprit und Reparaturen – und wird jedes Jahr weniger wert."],
   ['Opportunitätskosten','Jeder Euro kann nur einmal ausgegeben werden. Ein Kaffee für 5 € an jedem Arbeitstag sind etwa 1.100 € im Jahr. Monatlich in einen Sparplan mit 7 % gesteckt, wären das nach 30 Jahren rund 110.000 €. Der Kaffee ist trotzdem erlaubt – nur sollte man wissen, was er kostet.', ["Was kosten Süßigkeiten wirklich?", "Jeden Euro kannst du nur einmal ausgeben. Wer an jedem Schultag 2 € für Süßigkeiten ausgibt, kommt im Jahr auf rund 380 €. Das ist erlaubt – man sollte nur wissen, wie viel da zusammenkommt."]],
   ['Erst sich selbst bezahlen','Richte einen Dauerauftrag ein, der am Monatsanfang den Sparbetrag wegüberweist. Dann lebst du vom Rest – statt am Monatsende zu sparen, was übrig ist. Meist ist dann nämlich nichts übrig.', ["Erst sparen, dann ausgeben", "Leg gleich etwas zur Seite, wenn du Taschengeld bekommst – nicht erst das, was am Ende übrig ist. Denn meistens ist dann nichts mehr übrig."]],
   ['Erst der Notgroschen','Bevor du investierst: etwa zwei bis drei Netto-Monatsgehälter auf ein Tagesgeldkonto, als Familie eher sechs. Dann musst du nie Aktien im Crash verkaufen, nur weil die Waschmaschine kaputtgeht.', "Bevor man Geld anlegt, legt man etwas für Notfälle zur Seite. Dann muss man nichts verkaufen, wenn plötzlich das Fahrrad kaputtgeht."],
   ['Die Gehaltsfalle','Steigt das Einkommen, steigen oft die Ausgaben gleich mit: größere Wohnung, neueres Auto. Wer bei jeder Gehaltserhöhung die Hälfte zusätzlich spart, merkt den Verzicht kaum.', null]
  ],
  fact:'In Deutschland sparen Haushalte im Schnitt gut 10 % ihres verfügbaren Einkommens – deutlich mehr als in den USA. Ein großer Teil davon liegt aber auf Konten mit wenig Zinsen.',
  quiz:[
   ['Was solltest du anlegen, bevor du investierst?',['Einen Notgroschen von einigen Monatsgehältern','Ein Bitcoin-Depot','Eine Goldreserve','Einen Kredit'],0,'Der Notgroschen schützt dich davor, im falschen Moment verkaufen zu müssen.', ["Wofür ist ein Notgroschen da?", ["Für Süßigkeiten", "Für unerwartete Ausgaben, zum Beispiel ein kaputtes Fahrrad", "Für die Börse", "Als Geschenk für die Bank"], 1, "Mit Notgroschen musst du im Notfall nichts verkaufen und keine Schulden machen."]],
   ['Was bedeutet „Opportunitätskosten“?',['Kosten für einen Termin','Was man aufgibt, wenn man das Geld für etwas anderes verwendet','Kosten einer Firma','Eine Bankgebühr'],1,'Jede Ausgabe ist auch die Entscheidung gegen alle anderen Möglichkeiten.', ["2 € an jedem Schultag – wie viel ist das ungefähr im Jahr?", ["20 €", "100 €", "380 €", "5.000 €"], 2, "Rund 190 Schultage mal 2 € sind etwa 380 €."]],
   ['Was heißt „Erst sich selbst bezahlen“?',['Sich selbst ein Gehalt überweisen','Am Monatsanfang zuerst sparen, dann vom Rest leben','Alles für sich ausgeben','Keine Rechnungen bezahlen'],1,'Sparen wird zur festen Ausgabe statt zum Rest.', ["Wann sparst du am besten?", ["Gleich, wenn das Taschengeld kommt", "Am Monatsende, was übrig ist", "Nie", "Nur an Geburtstagen"], 0, "Wer zuerst spart, hat am Ende wirklich etwas gespart."]],
   ['Was ist eine Weiterbildung, die dein Einkommen erhöht?',['Konsum','Eine Investition','Eine Verbindlichkeit','Eine Schuld'],1,'Sie kostet heute und bringt später mehr Geld.']
  ]},
{ id:'boerse',
  src:[["Wikipedia: Niederländische Ostindien-Kompanie", "https://de.wikipedia.org/wiki/Niederländische_Ostindien-Kompanie"], ["Wikipedia: Börse", "https://de.wikipedia.org/wiki/Börse"], ["Wikipedia: Wirecard", "https://de.wikipedia.org/wiki/Wirecard"], ["Wikipedia: MSCI World", "https://de.wikipedia.org/wiki/MSCI_World"], ["Wikipedia: Exchange-traded Fund (ETF)", "https://de.wikipedia.org/wiki/Exchange-traded_fund"], ["Wikipedia: Dividende", "https://de.wikipedia.org/wiki/Dividende"], ["Wikipedia: Sondervermögen", "https://de.wikipedia.org/wiki/Sondervermögen"], ["Wikipedia: Sparer-Pauschbetrag", "https://de.wikipedia.org/wiki/Sparer-Pauschbetrag"]], name:'Börse', topic:'Aktien und ETFs',
  easy:{ fact:'Manche Firmen teilen ihren Gewinn mit den Aktionären. Das heißt <b>Dividende</b>. Wer eine Aktie hat, bekommt also manchmal Geld, ohne etwas zu verkaufen.' },
  moni:'Alle reden von Aktien und ETFs. Was kaufe ich da eigentlich?',
  cards:[
   ['Eine Aktie ist ein Stück Firma','Mit einer Aktie besitzt du einen kleinen Anteil an einem Unternehmen. Du verdienst, wenn der Kurs steigt, und oft über die <b>Dividende</b> – einen Teil des Gewinns, den die Firma ausschüttet.'],
   ['Warum Kurse steigen und fallen','Auch an der Börse gilt Angebot und Nachfrage. Wollen mehr Leute eine Aktie kaufen als verkaufen, steigt der Kurs – so lange, bis sich genug Verkäufer finden. Gute Nachrichten über eine Firma locken Käufer an, schlechte vertreiben sie. Bei Panik wollen alle gleichzeitig verkaufen – dann stürzt der Kurs, auch wenn sich an der Firma selbst wenig geändert hat.', "An der Börse ist es wie auf dem Wochenmarkt: Wollen viele eine Aktie kaufen, steigt ihr Preis. Wollen viele sie loswerden, fällt er. Gute Nachrichten über eine Firma machen ihre Aktie beliebt, schlechte Nachrichten unbeliebt."],
   ['Die erste Aktiengesellschaft','1602 gründeten Kaufleute in Amsterdam die Niederländische Ostindien-Kompanie (VOC). Ihre Anteile konnte jeder kaufen und verkaufen – daraus entstand die erste Börse im heutigen Sinn.', "Vor über 400 Jahren konnte man in Amsterdam zum ersten Mal Anteile an einer Firma kaufen und weiterverkaufen. So entstand die erste Börse."],
   ['Das Risiko der Einzelaktie','Einzelne Firmen können pleitegehen. Wirecard war 2018 im DAX und meldete 2020 Insolvenz an – die Aktie war praktisch nichts mehr wert. Wer nur auf eine Firma setzt, kann alles verlieren.', "Eine einzelne Firma kann pleitegehen. Dann ist ihre Aktie nichts mehr wert. Das ist zum Beispiel 2020 der Firma Wirecard passiert."],
   ['Streuen statt wetten','Kaufst du viele Firmen aus vielen Ländern und Branchen, fällt eine Pleite kaum ins Gewicht. Das heißt <b>Diversifikation</b>. Die Schwankungen des ganzen Marktes bleiben trotzdem.', "Leg nicht alle Eier in einen Korb: Fällt er runter, sind alle kaputt. Kaufst du Anteile an vielen Firmen, ist eine Pleite nicht so schlimm. Das nennt man <b>streuen</b>."],
   ['Was ein ETF ist','ETF steht für <i>Exchange Traded Fund</i>, einen börsengehandelten Indexfonds. Er bildet einen Index nach, etwa den MSCI World mit rund 1.300 Firmen aus 23 Industrieländern. Die Kosten (TER) liegen oft bei 0,1 bis 0,3 % im Jahr. Aktiv gemanagte Fonds kosten oft 1,5 % und mehr – und schlagen den Markt über lange Zeit meist nicht.', "Ein <b>ETF</b> ist wie eine große Tüte mit Anteilen an vielen Firmen. Ein ETF auf den Weltindex enthält rund 1.300 Firmen aus vielen Ländern – und kostet nur wenig Gebühren."],
   ['Rauf und runter','Breit gestreute Aktien brachten historisch langfristig etwa 6 bis 8 % pro Jahr. Dazwischen gab es tiefe Einbrüche: 2008 rund −40 %, im Corona-Crash 2020 über −30 % in wenigen Wochen. Wer 15 Jahre und länger dabeiblieb, lag beim Weltindex historisch fast immer im Plus.', "Aktien gehen rauf und runter. Manchmal fallen sie in kurzer Zeit um ein Drittel. Wer aber viele Jahre durchgehalten hat, lag mit einem weltweiten ETF bisher fast immer im Plus."],
   ['Sparplan und Steuern','Mit einem Sparplan kaufst du jeden Monat automatisch Anteile, mal teurer, mal billiger. Auf Gewinne fallen in Deutschland 25 % Abgeltungsteuer plus Soli an – die ersten <b>1.000 € pro Jahr</b> (Paare 2.000 €) bleiben über den Sparerpauschbetrag steuerfrei.', ["Der Sparplan", "Mit einem Sparplan steckst du jeden Monat automatisch einen kleinen Betrag in einen ETF – schon ab ein paar Euro. Was dabei mit Steuern ist, erfährst du an der nächsten Station, im Finanzamt."]],
   ['Sicher verwahrt','ETF-Anteile sind <b>Sondervermögen</b>. Geht der ETF-Anbieter oder deine Bank pleite, gehören die Anteile weiterhin dir.', null]
  ],
  fact:'Ausschüttende ETFs zahlen Dividenden aufs Konto, thesaurierende legen sie automatisch wieder an – das ist eingebauter Zinseszins.',
  quiz:[
   ['Was kaufst du mit einer Aktie?',['Einen Kredit an die Firma','Einen Anteil an der Firma','Ein Produkt der Firma','Einen Gutschein'],1,'Aktionäre sind Miteigentümer.'],
   ['Wofür steht ETF?',['Euro Trading Fund','Exchange Traded Fund','Extra Tax Free','Easy To Find'],1,'Ein Fonds, der an der Börse gehandelt wird.'],
   ['Wozu dient Diversifikation?',['Um das Risiko einzelner Firmen zu verringern','Um Steuern zu vermeiden','Um schneller reich zu werden','Um Gebühren zu sparen'],0,'Viele kleine Teile statt einer großen Wette.'],
   ['Wie viel Kapitalertrag bleibt für eine Person pro Jahr steuerfrei?',['100 €','801 €','1.000 €','10.000 €'],2,'Seit 2023 sind es 1.000 € (vorher 801 €).', ["Was ist ein Sparplan?", ["Ein Plan für den Urlaub", "Jeden Monat automatisch einen Betrag anlegen", "Ein Kredit", "Ein Sparschwein aus Plastik"], 1, "Kleine Beträge, regelmäßig – und der Zinseszins macht den Rest."]]
  ]},
{ id:'steuern',
  src:[["Wikipedia: Abgeltungsteuer", "https://de.wikipedia.org/wiki/Abgeltungsteuer_(Deutschland)"], ["Wikipedia: Sparer-Pauschbetrag", "https://de.wikipedia.org/wiki/Sparer-Pauschbetrag"], ["§ 20 EStG – Kapitalvermögen, Verlustverrechnung", "https://www.gesetze-im-internet.de/estg/__20.html"], ["§ 32d EStG – Steuersatz, Günstigerprüfung", "https://www.gesetze-im-internet.de/estg/__32d.html"], ["§ 23 EStG – Private Veräußerungsgeschäfte (Gold, Bitcoin)", "https://www.gesetze-im-internet.de/estg/__23.html"], ["§ 20 InvStG – Teilfreistellung", "https://www.gesetze-im-internet.de/invstg_2018/__20.html"], ["§ 18 InvStG – Vorabpauschale", "https://www.gesetze-im-internet.de/invstg_2018/__18.html"], ["Wikipedia: Mehrwertsteuer", "https://de.wikipedia.org/wiki/Mehrwertsteuer"], ["Wikipedia: Steuer (Wortherkunft)", "https://de.wikipedia.org/wiki/Steuer"]], name:'Finanzamt', topic:'Steuern auf Kapitalerträge',
  moni:'Gewinne sind schön – aber das Finanzamt verdient mit. Wie viel genau? Und wie zahle ich nicht mehr als nötig?',
  cards:[
   ['Die Abgeltungsteuer','Auf Kapitalerträge – Zinsen, Dividenden, Kursgewinne aus Aktien und Fonds – fallen pauschal <b>25 % Abgeltungsteuer</b> an, dazu 5,5 % Solidaritätszuschlag auf die Steuer. Zusammen sind das <b>26,375 %</b>. Wer Kirchensteuer zahlt, kommt auf knapp 28 %. Die Bank führt die Steuer direkt ans Finanzamt ab.'],
   ['Freibetrag und Freistellungsauftrag','Die ersten <b>1.000 €</b> Kapitalerträge im Jahr sind steuerfrei (Sparerpauschbetrag), bei gemeinsam veranlagten Paaren 2.000 €. Damit die Bank ihn berücksichtigt, braucht sie einen <b>Freistellungsauftrag</b>; bei mehreren Banken teilst du den Betrag auf. Wer insgesamt wenig Einkommen hat, etwa Studierende, kann eine <b>NV-Bescheinigung</b> beantragen und zahlt dann gar keine Abgeltungsteuer.'],
   ['Die Günstigerprüfung','Liegt dein persönlicher Einkommensteuersatz unter 25 %, kannst du in der Steuererklärung (Anlage KAP) die <b>Günstigerprüfung</b> beantragen. Dann werden die Kapitalerträge mit deinem niedrigeren Satz besteuert, und zu viel gezahlte Steuer kommt zurück.'],
   ['Teilfreistellung bei Fonds','Bei Aktienfonds und Aktien-ETFs (mindestens 51 % Aktien) sind <b>30 % der Erträge steuerfrei</b>, bei Mischfonds 15 %. Beispiel: 3.000 € Gewinn mit einem Welt-ETF → 2.100 € steuerpflichtig → minus 1.000 € Freibetrag → 1.100 € × 26,375 % = <b>rund 290 € Steuern</b>.'],
   ['Die Vorabpauschale','Thesaurierende ETFs schütten nichts aus. Damit trotzdem jedes Jahr etwas versteuert wird, gibt es die <b>Vorabpauschale</b>: Fondswert am Jahresanfang × 70 % des Basiszinses, den das Finanzministerium jedes Jahr festlegt – höchstens aber der tatsächliche Wertzuwachs. Die Bank zieht sie Anfang des Folgejahres ab, zuerst über den Freibetrag. Beim Verkauf wird sie angerechnet; doppelt zahlst du also nicht.'],
   ['Verluste verrechnen','Verluste sind steuerlich nicht verloren: Die Bank führt einen <b>Verlusttopf</b> und verrechnet ihn mit späteren Gewinnen. Verluste aus <b>Einzelaktien</b> landen in einem eigenen Aktientopf und dürfen nur mit Aktiengewinnen verrechnet werden. Verluste bei verschiedenen Banken führst du über eine <b>Verlustbescheinigung</b> (Antrag bis 15. Dezember) in der Steuererklärung zusammen.'],
   ['Gold, Bitcoin & Co.','Physisches Gold und Kryptowährungen fallen nicht unter die Abgeltungsteuer, sondern unter die <b>privaten Veräußerungsgeschäfte</b> (§ 23 EStG). Verkaufst du nach <b>mehr als einem Jahr</b>, ist der Gewinn steuerfrei. Davor gilt dein persönlicher Steuersatz, mit einer <b>Freigrenze von 1.000 €</b> im Jahr. Freigrenze heißt: Liegt der Gewinn darüber, ist der ganze Gewinn steuerpflichtig, nicht nur der Teil darüber.'],
   ['Und im Simulator?','Zinsen werden im echten Leben jedes Jahr versteuert, sobald sie gutgeschrieben werden. Der Simulator vereinfacht: Moni zahlt 26,375 % erst beim Verkauf, ohne Teilfreistellung, Vorabpauschale, Kirchensteuer und getrennten Aktientopf. Gold und Bitcoin sind dort immer steuerfrei.']
  ],
  fact:'Ein ungenutzter Freibetrag verfällt am Jahresende. Profi-Trick: Bleibt im Dezember etwas übrig, verkaufst du Gewinne bis zu dieser Höhe und kaufst sofort wieder. Dein Einstandskurs steigt, und später fällt weniger Steuer an. Ordergebühren sollten dabei kleiner sein als die Ersparnis.',
  quiz:[
   ['Wie hoch ist die Abgeltungsteuer inklusive Soli, ohne Kirchensteuer?',['19 %','25 %','26,375 %','42 %'],2,'25 % plus 5,5 % Soli auf die Steuer ergibt 26,375 %.'],
   ['Welcher Anteil eines Gewinns aus einem Aktien-ETF ist durch die Teilfreistellung steuerfrei?',['0 %','15 %','30 %','100 %'],2,'Bei Aktienfonds sind es 30 %, bei Mischfonds 15 %.'],
   ['Du verkaufst Bitcoin nach 14 Monaten mit Gewinn. Was gilt?',['Abgeltungsteuer','Steuerfrei, weil länger als ein Jahr gehalten','Dein persönlicher Steuersatz','Mehrwertsteuer'],1,'Private Veräußerungsgeschäfte sind nach mehr als einem Jahr steuerfrei.'],
   ['Womit dürfen Verluste aus Einzelaktien verrechnet werden?',['Mit allen Kapitalerträgen','Nur mit Gewinnen aus Aktien','Mit dem Gehalt','Gar nicht'],1,'Dafür führt die Bank einen eigenen Aktienverlusttopf.']
  ],
  easy:{ topic:'Was sind Steuern?',
   moni:'Ich habe gehört, von Gewinnen muss man etwas abgeben. An wen denn – und warum eigentlich?',
   cards:[
    ['Was sind Steuern?','Steuern ist Geld, das Menschen und Firmen an den Staat zahlen. Davon werden Schulen, Straßen, Spielplätze, Polizei und Feuerwehr bezahlt. Steuern sind also unser gemeinsames Geld für Dinge, die allen gehören.'],
    ['Steuern im Eis','Kaufst du ein Eis, steckt im Preis schon eine Steuer: die <b>Mehrwertsteuer</b>. Bei Lebensmitteln sind es meist 7 %, bei fast allem anderen 19 %. Auf dem Kassenzettel steht, wie viel es war. Auch Kinder zahlen also schon Steuern!'],
    ['Steuern aufs Gehalt','Wer arbeitet, zahlt <b>Einkommensteuer</b>. Wer wenig verdient, zahlt gar keine. Wer mehr verdient, gibt einen größeren Anteil ab. Starke Schultern tragen mehr.'],
    ['Steuern auf Gewinne','Bringt dein Geld Zinsen, oder verkaufst du eine Aktie teurer, als du sie gekauft hast, ist das auch Einkommen. Davon geht ungefähr <b>ein Viertel</b> als Steuer weg.'],
    ['Der Freibetrag','Aber: Die ersten <b>1.000 € Gewinn im Jahr</b> sind steuerfrei – auch für Kinder. Damit die Bank das weiß, bekommt sie einen <b>Freistellungsauftrag</b>, meistens von den Eltern. Auf dein Sparbuch zahlst du also sehr wahrscheinlich keine Steuern.'],
    ['Wer kümmert sich darum?','Das <b>Finanzamt</b> sammelt die Steuern ein. Bei Zinsen und Aktien zieht die Bank sie automatisch ab. Viele Erwachsene geben außerdem einmal im Jahr eine <b>Steuererklärung</b> ab – oft bekommen sie dann sogar Geld zurück.']
   ],
   fact:'Das Wort „Steuer“ kommt vom althochdeutschen <i>stiura</i>. Das heißt Stütze oder Hilfe – Steuern sollen den Staat stützen.',
   quiz:[
    ['Wofür bezahlt der Staat mit Steuern?',['Nur für Politiker-Autos','Für Schulen, Straßen und Spielplätze','Für dein Taschengeld','Für gar nichts'],1,'Steuern bezahlen Dinge, die wir alle gemeinsam nutzen.'],
    ['Welche Steuer zahlst du schon beim Eiskaufen?',['Hundesteuer','Mehrwertsteuer','Einkommensteuer','Gar keine'],1,'Sie steckt schon im Preis.'],
    ['Wie viel Gewinn aus Zinsen und Aktien ist pro Jahr steuerfrei?',['10 €','100 €','1.000 €','Alles'],2,'Der Freibetrag liegt bei 1.000 € pro Person – auch für Kinder.'],
    ['Wer sammelt die Steuern ein?',['Die Schule','Das Finanzamt','Der Bäcker','Die Börse'],1,'Bei Zinsen und Aktien hilft die Bank und zieht die Steuer gleich ab.']
   ]}},
{ id:'leasing',
  src:[["Wikipedia: Leasing", "https://de.wikipedia.org/wiki/Leasing"], ["Wikipedia: Restwert", "https://de.wikipedia.org/wiki/Restwert"], ["finanz.de: Leasing und Leasingfaktor", "https://www.finanz.de/finanzierung/leasing/"], ["Wikipedia: JobRad (Dienstrad-Leasing)", "https://de.wikipedia.org/wiki/Jobrad"]], name:'Autohaus', topic:'Was Leasing bedeutet',
  moni:'Im Autohaus steht: „Nur 199 € im Monat!“ Ist das ein Schnäppchen?',
  cards:[
   ['Leasing ist langes Mieten','Du zahlst jeden Monat dafür, ein Auto (oder ein Fahrrad, Handy, eine Maschine) zu nutzen. Es gehört aber der Leasinggesellschaft. Am Ende gibst du es zurück und hast nichts, was du verkaufen könntest.', "Leasing ist wie Mieten für lange Zeit: Man zahlt jeden Monat und darf das Auto fahren. Es gehört einem aber nie. Am Ende gibt man es zurück."],
   ['Kilometerleasing','Du vereinbarst, wie viel du fährst, z. B. 10.000 km im Jahr. Fährst du mehr, zahlst du jeden Mehrkilometer nach. Fährst du weniger, gibt es meist nur wenig zurück.', "Meist vereinbart man, wie viele Kilometer man fahren darf. Fährt man mehr, muss man extra zahlen."],
   ['Restwertleasing','Hier wird festgelegt, was das Auto am Ende noch wert sein soll. Ist es weniger wert, zahlst <b>du</b> die Differenz. Das Risiko liegt also beim Kunden.', null],
   ['Das Kleingedruckte','Zur Rate kommen oft eine Leasingsonderzahlung (wie eine Anzahlung), Überführungskosten, eine Pflicht-Vollkasko und bei der Rückgabe Kosten für Kratzer und Dellen. Die 199 € sind selten alles.', "„Nur 199 € im Monat!“ – oft kommen noch Kosten dazu: eine Anzahlung, eine teure Versicherung und Geld für Kratzer bei der Rückgabe."],
   ['Der Leasingfaktor','Monatsrate ÷ Listenpreis × 100. Ein Auto für 40.000 € mit 250 € Rate hat den Faktor 0,63. Unter 1 gilt als günstiges Angebot – vorausgesetzt, es gibt keine hohe Sonderzahlung.', null],
   ['Für wen lohnt es sich?','Für Firmen und Selbstständige, weil sie die Raten als Betriebsausgabe absetzen können, und für Leute, die immer ein neues Auto wollen. Für Privatleute ist ein gut gekaufter Gebrauchter meist günstiger. Ein Neuwagen verliert in den ersten drei Jahren oft 30 bis 40 % seines Werts – beim Leasing bezahlst du genau diesen Wertverlust.', "Ein neues Auto verliert in den ersten drei Jahren oft ein Drittel seines Werts. Beim Leasing bezahlt man genau diesen Wertverlust. Ein guter Gebrauchtwagen ist für die meisten Familien billiger."]
  ],
  fact:'Das Dienstrad-Leasing über den Arbeitgeber wird in Deutschland steuerlich gefördert. Deshalb fahren so viele Leute ein teures E-Bike „vom Chef“.',
  quiz:[
   ['Wem gehört ein geleastes Auto?',['Dir','Der Leasinggesellschaft','Dem Staat','Dem Autohaus für immer'],1,'Du nutzt es nur und gibst es am Ende zurück.'],
   ['Beim Restwertleasing ist das Auto am Ende weniger wert als vereinbart. Wer zahlt die Differenz?',['Die Leasinggesellschaft','Du','Die Versicherung','Niemand'],1,'Das Restwertrisiko trägt der Kunde.', ["Was passiert am Ende des Leasings?", ["Das Auto gehört dir", "Du gibst das Auto zurück", "Das Auto wird verschrottet", "Du bekommst ein Fahrrad dazu"], 1, "Beim Leasing mietest du nur – am Ende geht das Auto zurück."]],
   ['Rate 250 €, Listenpreis 40.000 €. Wie hoch ist der Leasingfaktor?',['0,63','1,6','6,3','16'],0,'250 ÷ 40.000 × 100 = 0,625.', ["Was kann zur Leasingrate noch dazukommen?", ["Nichts", "Anzahlung, Versicherung und Kosten für Kratzer", "Ein Gratis-Auto", "Taschengeld"], 1, "Die Werbe-Rate ist selten alles, was man zahlt."]],
   ['Was kostet beim Kilometerleasing extra?',['Weniger fahren','Mehr fahren als vereinbart','Tanken','Radio hören'],1,'Mehrkilometer werden nachberechnet.']
  ]},
{ id:'krypto',
  src:[["Satoshi Nakamoto: Bitcoin-Whitepaper, 2008 (englisch, PDF)", "https://bitcoin.org/bitcoin.pdf"], ["Wikipedia: Bitcoin", "https://de.wikipedia.org/wiki/Bitcoin"], ["Wikipedia: Bitcoin Pizza Day (englisch)", "https://en.wikipedia.org/wiki/Bitcoin_Pizza_Day"], ["Wikipedia: Mt. Gox", "https://de.wikipedia.org/wiki/Mt.Gox"], ["Wikipedia: FTX", "https://de.wikipedia.org/wiki/FTX"], ["§ 23 EStG – Private Veräußerungsgeschäfte", "https://www.gesetze-im-internet.de/estg/__23.html"]], name:'Krypto-Labor', topic:'Fakten über Bitcoin',
  moni:'Mein Nachbar sagt, Bitcoin ist das Gold der Zukunft. Meine Oma sagt, das ist Spielgeld. Wer hat recht?',
  cards:[
   ['Geboren aus der Finanzkrise','Am 31. Oktober 2008 veröffentlichte jemand unter dem Namen „Satoshi Nakamoto“ das Bitcoin-Konzept. Wer das ist, weiß bis heute niemand. Im ersten Block vom 3. Januar 2009 steht eine Zeitungsschlagzeile über die Rettung britischer Banken.', ["Wer hat Bitcoin erfunden?", "2008 hat jemand mit dem Namen „Satoshi Nakamoto“ Bitcoin erfunden. Wer das wirklich ist, weiß bis heute niemand!"]],
   ['Ein Kassenbuch für alle','Die <b>Blockchain</b> ist ein öffentliches Kassenbuch, das Tausende Computer gemeinsam führen. Jede Zahlung steht darin. Es gibt keine Bank und keine Zentralbank, die bestimmt oder rückgängig machen kann.', "Die <b>Blockchain</b> ist wie ein riesiges Heft, in dem jede Bitcoin-Zahlung steht. Tausende Computer haben eine Kopie davon. Deshalb kann niemand heimlich etwas ändern."],
   ['Mining','Rechner lösen um die Wette ein Rechenrätsel (Proof of Work). Wer gewinnt, hängt den nächsten Block an und bekommt neue Bitcoin. Etwa alle 10 Minuten entsteht ein Block. Dafür wird sehr viel Strom verbraucht.', "Computer lösen um die Wette schwierige Rechenrätsel. Wer gewinnt, bekommt neue Bitcoin. Das verbraucht sehr viel Strom."],
   ['Fest begrenzt','Es wird höchstens <b>21 Millionen</b> Bitcoin geben. Etwa alle vier Jahre halbiert sich die Belohnung für die Miner („Halving“). Seit April 2024 sind es 3,125 BTC pro Block; das nächste Halving wird um 2028 erwartet, der letzte Bitcoin um das Jahr 2140.', "Es wird nie mehr als <b>21 Millionen</b> Bitcoin geben. Das ist fest so programmiert."],
   ['Die teuerste Pizza','Am 22. Mai 2010 bezahlte Laszlo Hanyecz zwei Pizzen mit 10.000 Bitcoin – der erste bekannte Kauf. Bitcoin-Fans feiern den Tag jedes Jahr als „Pizza Day“.'],
   ['Wilde Schwankungen','Bitcoin hat keine Zinsen, keine Dividende und keine Firma dahinter. Sein Preis hängt nur an Angebot und Nachfrage. Er ist mehrfach um 70 bis 80 % eingebrochen (2018, 2022) und danach auf neue Rekorde gestiegen.', "Hinter Bitcoin steht keine Firma, und es gibt keine Zinsen. Der Preis springt wild rauf und runter – er ist schon mehrmals um drei Viertel gefallen."],
   ['Nicht deine Schlüssel …','„Not your keys, not your coins.“ Wer seinen privaten Schlüssel verliert, verliert seine Bitcoin für immer. Wer sie bei einer Börse liegen lässt, kann sie bei deren Pleite verlieren – wie bei Mt. Gox 2014 und FTX 2022.', "Bitcoin schützt man mit einem geheimen Schlüssel – einer Art Passwort. Wer ihn verliert, kommt nie wieder an seine Bitcoin. Niemand kann helfen."],
   ['Steuern','In Deutschland sind Gewinne aus Bitcoin nach aktueller Rechtslage steuerfrei, wenn man sie länger als ein Jahr gehalten hat. Davor zählen sie zum Einkommen.', null]
  ],
  fact:'Die kleinste Einheit heißt Satoshi: 1 Bitcoin = 100.000.000 Satoshi. Man muss also nie einen ganzen Bitcoin kaufen.',
  quiz:[
   ['Wie viele Bitcoin kann es höchstens geben?',['21 Millionen','100 Millionen','1 Milliarde','Unbegrenzt'],0,'Die Grenze steht im Programmcode.'],
   ['Was passiert beim Halving?',['Der Preis halbiert sich','Die Belohnung für die Miner halbiert sich','Jeder Bitcoin wird geteilt','Die Hälfte wird gelöscht'],1,'Etwa alle vier Jahre gibt es nur noch halb so viele neue Bitcoin pro Block.', ["Wer hat Bitcoin erfunden?", ["Die Europäische Zentralbank", "Ein Pizzabäcker", "Jemand, der sich Satoshi Nakamoto nennt", "Die Stadt Amsterdam"], 2, "Wer hinter dem Namen steckt, weiß bis heute niemand."]],
   ['Was passiert, wenn du deinen privaten Schlüssel verlierst?',['Die Bank schickt einen neuen','Deine Bitcoin sind für immer weg','Satoshi hilft dir','Nichts, die Blockchain merkt es sich'],1,'Es gibt niemanden, der den Zugang wiederherstellen kann.'],
   ['Wofür wurden 2010 10.000 Bitcoin ausgegeben?',['Für ein Auto','Für zwei Pizzen','Für ein Haus','Für einen Computer'],1,'Der berühmte Pizza Day am 22. Mai 2010.']
  ]},
{ id:'tresor',
  src:[["Wikipedia: Goldpreis", "https://de.wikipedia.org/wiki/Goldpreis"], ["World Gold Council: Gold Demand Trends 2025 (englisch, PDF)", "https://www.gold.org/download/file/20498/FY_2025_GDT_Press_Release.pdf"], ["Wikipedia: Goldreserve", "https://de.wikipedia.org/wiki/Goldreserve"], ["Wikipedia: Anlagemünze", "https://de.wikipedia.org/wiki/Anlagemünze"], ["§ 25c UStG – Anlagegold ist umsatzsteuerfrei", "https://www.gesetze-im-internet.de/ustg_1980/__25c.html"], ["Finanztip: Gold als Geldanlage", "https://www.finanztip.de/gold/"]], name:'Tresor', topic:'Gold als Geldanlage',
  moni:'Gold war jahrtausendelang Geld. Sollte ich mir heute welches kaufen?',
  cards:[
   ['Gold zahlt keine Zinsen','Gold bringt weder Zinsen noch Dividenden. Du verdienst nur, wenn jemand später mehr dafür bezahlt. Lagern und versichern kostet sogar Geld.'],
   ['Der Krisenschutz','In Krisen, Kriegen und bei hoher Inflation ist Gold oft gefragt. Zentralbanken kauften 2022, 2023 und 2024 jeweils über 1.000 Tonnen, 2025 rund 863 Tonnen. In den Jahren 2024 bis 2026 stieg der Goldpreis immer wieder auf neue Rekorde.', "Wenn die Leute Angst haben, zum Beispiel in Krisen, kaufen sie gern Gold. Auch Zentralbanken kaufen seit ein paar Jahren besonders viel Gold."],
   ['Gold kann lange schlafen','1980 kostete eine Unze rund 850 Dollar. Erst 2008 war dieser Preis wieder erreicht – 28 Jahre ohne Gewinn. Rechnet man die Inflation heraus, dauerte es noch länger.', "1980 war Gold sehr teuer. Danach dauerte es 28 Jahre, bis es wieder so viel kostete. So lange ohne Gewinn – das muss man aushalten."],
   ['Barren, Münzen, Spread','Gold gibt es als Barren und Anlagemünzen (Krügerrand, Maple Leaf, Wiener Philharmoniker). Händler kaufen billiger an, als sie verkaufen – das ist der Spread. Bei kleinen Barren ist der Aufschlag besonders hoch.', "Gold kauft man als Barren oder Münzen. Der Händler verkauft teurer, als er zurückkauft. Den Unterschied behält er."],

const KEY = 'whats-money-v1';
const fresh = () => ({ money:1000, best:{}, free:false, mode:'einfach' });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const $ = s => document.querySelector(s);
const view = $('#view');
const eur = n => Math.round(n).toLocaleString('de-DE') + ' €';
const starsOf = sc => sc >= 4 ? 3 : sc === 3 ? 2 : sc === 2 ? 1 : 0;
const starStr = n => '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>';
const isDone = id => S.best[id] !== undefined;
const unlocked = i => S.free || i === 0 || isDone(STATIONS[i].id) || isDone(STATIONS[i-1].id);
/* Inhalt einer Station im gewählten Modus. Einfach: Karte [Titel, Text, leicht] – leicht ist ein Text, eine Ersatzkarte oder null (ausblenden);
   Quizfrage [..., leicht] als Ersatzfrage; st.easy ersetzt ganze Felder. */
function sv(st){
  if (pro()) return { topic:st.topic, moni:st.moni, fact:st.fact, cards:st.cards.map(c=>c.slice(0,2)), quiz:st.quiz.map(q=>q.slice(0,4)) };
  const e = st.easy || {};
  return { topic:e.topic||st.topic, moni:e.moni||st.moni, fact:e.fact||st.fact,
    cards: e.cards || st.cards.map(c => c[2]===undefined ? c.slice(0,2) : c[2]===null ? null : typeof c[2]==='string' ? [c[0],c[2]] : c[2]).filter(Boolean),
    quiz: e.quiz || st.quiz.map(q => q[4] || q.slice(0,4)) };
}
const simOpen = () => S.free || isDone('zins');
const totalStars = () => STATIONS.reduce((a,s) => a + (isDone(s.id) ? starsOf(S.best[s.id]) : 0), 0);
const pro = () => S.mode === 'profi';
function modeSwitch(locked){
  return `<div class="seg" role="group" aria-label="Schwierigkeit"><span class="label">Schwierigkeit</span>${[['einfach','Einfach'],['profi','Profi']].map(([m,t])=>
    `<button data-mode="${m}" aria-pressed="${S.mode===m}" ${locked?'disabled':''}>${t}</button>`).join('')}</div>`;
}
function bindMode(after){ view.querySelectorAll('.seg button').forEach(b => b.onclick = () => { if (S.mode === b.dataset.mode) return; S.mode = b.dataset.mode; save(); after(); const f = view.querySelector(`.seg button[data-mode="${S.mode}"]`); if (f && !f.disabled) f.focus(); }); }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- Station ---------- */
let cur = null;
function startStation(i){
  const st = STATIONS[i];
  const v = sv(st);
  cur = { i, st, v, phase:'cards', ci:-1, qi:0, score:0, qs: v.quiz.map(q => ({ q:q[0], a:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))), e:q[3] })) };
  renderStation();
}
function head(){
  const st = cur.st;
  return `<div class="crumbs"><button class="back" id="back">← Karte</button><span class="label">Station ${cur.i+1} von ${STATIONS.length}</span></div>
          <h2>${st.name}: ${cur.v.topic}</h2>`;
}
function renderStation(){
  const st = cur.st;
  let body = '';
  if (cur.phase === 'cards'){
    const all = cur.v.cards.length + 1;
    if (cur.ci === -1){
      body = `<div class="say">${moni('think',true)}<div class="bubble"><p>${cur.v.moni}</p></div></div>
        <div class="row"><button class="btn primary" id="next">Los geht's</button></div>`;
    } else {
      const isFact = cur.ci === cur.v.cards.length;
      const c = isFact ? ['Wusstest du?', cur.v.fact] : cur.v.cards[cur.ci];
      body = `<article class="lesson${isFact?' fact':''}"><h3>${c[0]}</h3><p>${c[1]}</p></article>
        <div class="dots" aria-hidden="true">${Array.from({length:all},(_,k)=>`<span class="${k<=cur.ci?'on':''}"></span>`).join('')}</div>
        <div class="row"><button class="btn" id="prev">Zurück</button><button class="btn primary" id="next">${isFact ? (st.extra?'Ausprobieren':'Zum Quiz') : 'Weiter'}</button></div>`;
    }
  } else if (cur.phase === 'extra'){
    body = EXTRAS[st.extra].html() + `<div class="row"><button class="btn primary" id="next">Zum Quiz</button></div>`;
  } else if (cur.phase === 'quiz'){
    const q = cur.qs[cur.qi];
    body = `<p class="label">Frage ${cur.qi+1} von ${cur.qs.length} · richtig: ${cur.score}</p>
      <h3>${q.q}</h3>
      <div class="answers">${q.a.map((a,k)=>`<button class="ans" data-k="${k}">${a.t}</button>`).join('')}</div>
      <div id="fb"></div>`;
  } else {
    body = cur.resultHtml;
  }
  const showSrc = st.src && cur.phase !== 'quiz' && !(cur.phase === 'cards' && cur.ci === -1);
  view.innerHTML = `<section class="panel">${head()}${body}${showSrc ? srcBox(st.src, 'Quellen zu dieser Station') : ''}</section>`;
  $('#back').onclick = showMap;
  const nx = $('#next'), pv = $('#prev');
  if (pv) pv.onclick = () => { cur.ci--; renderStation(); };
  if (nx) nx.onclick = () => {
    if (cur.phase === 'cards'){
      if (cur.ci < cur.v.cards.length) cur.ci++;
      else cur.phase = st.extra ? 'extra' : 'quiz';
    } else if (cur.phase === 'extra') cur.phase = 'quiz';
    renderStation();
  };
  if (cur.phase === 'extra') EXTRAS[st.extra].init();
  if (cur.phase === 'quiz') view.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (cur.phase === 'done'){ $('#again').onclick = () => startStation(cur.i); const n=$('#goNext'); if(n) n.onclick = () => startStation(cur.i+1); const s=$('#goSim'); if(s) s.onclick = showSim; }
}
function srcBox(list, title){
  return `<details class="info src"><summary>${title}</summary><ul>${list.map(([t,u]) => `<li>${u ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t}</li>`).join('')}</ul></details>`;
}
const SIM_SRC = [
  ['Wikipedia: MSCI World (Renditen und Crashs des Weltindex)','https://de.wikipedia.org/wiki/MSCI_World'],
  ['Wikipedia: Goldpreis','https://de.wikipedia.org/wiki/Goldpreis'],
  ['Wikipedia: Bitcoin','https://de.wikipedia.org/wiki/Bitcoin'],
  ['Wikipedia: Abgeltungsteuer','https://de.wikipedia.org/wiki/Abgeltungsteuer_(Deutschland)'],
  ['Wikipedia: Sparer-Pauschbetrag','https://de.wikipedia.org/wiki/Sparer-Pauschbetrag'],
  ['§ 23 EStG – Gold und Bitcoin nach einem Jahr steuerfrei','https://www.gesetze-im-internet.de/estg/__23.html'],
  ['Renditen, Schwankungen und Pleiterisiko im Spiel: eigene, grob gerundete Annahmen – keine Prognose',null]
];
function answer(k){
  const q = cur.qs[cur.qi], ok = q.a[k].ok;
  if (ok) cur.score++;
  view.querySelectorAll('.ans').forEach((b,j) => { b.disabled = true; if (q.a[j].ok) b.classList.add('right'); else if (j===k) b.classList.add('wrong'); });
  const last = cur.qi === cur.qs.length - 1;
  $('#fb').innerHTML = `<div class="say">${moni(ok?'wow':'sad')}<div class="bubble expl${ok?'':' bad'}"><p><b>${ok?'Richtig!':'Knapp daneben.'}</b> ${q.e}</p></div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="qn">${last?'Auswertung':'Nächste Frage'}</button></div>`;
  $('#qn').onclick = () => { if (last) finish(); else { cur.qi++; renderStation(); } };
  $('#qn').focus();
}
function finish(){
  const st = cur.st, prev = S.best[st.id];
  const prevScore = prev === undefined ? 0 : prev;
  let earned = 25 * Math.max(0, cur.score - prevScore);
  if (cur.score === cur.qs.length && prevScore < cur.qs.length) earned += 100;
  S.best[st.id] = Math.max(prevScore, cur.score);
  if (prev === undefined && cur.score === 0) S.best[st.id] = 0;
  S.money += earned; save();
  const n = starsOf(cur.score);
  const nextSt = STATIONS[cur.i+1];
  const unlock = { bank:'Tagesgeld', boerse:'ETF Welt und Einzelaktie', krypto:'Bitcoin', tresor:'Gold' }[st.id];
  const say = cur.score === cur.qs.length ? 'Alles richtig! Dafür gibt es 100 € Extrabonus.' : cur.score >= 2 ? 'Gut gemacht! Wenn du magst, versuch die Station nochmal für alle drei Sterne.' : 'Das war schwer. Lies die Karten nochmal – beim zweiten Mal sitzt es.';
  cur.phase = 'done';
  cur.resultHtml = `<div class="result-stars" aria-label="${n} von 3 Sternen">${starStr(n)}</div>
    <div class="say">${moni(n>=2?'happy':'think',true)}<div class="bubble"><p>${cur.score} von ${cur.qs.length} richtig. ${say}
      ${earned?`<br>Ich bekomme <b>${eur(earned)}</b> Wissensbonus.`:'<br>Diesmal kein neuer Bonus – den gibt es nur für ein besseres Ergebnis.'}
      ${unlock?`<br>Neu im Simulator: <b>${unlock}</b>.`:''}
      ${st.id==='zins'?'<br>Der <b>Anlage-Simulator</b> ist jetzt offen!':''}</p></div></div>
    <div class="row"><button class="btn" id="again">Nochmal spielen</button>
      ${nextSt?`<button class="btn primary" id="goNext">Weiter: ${nextSt.name}</button>`:`<button class="btn primary" id="goSim">Zum Anlage-Simulator</button>`}</div>`;
  wallet(earned);
  renderStation();
}

function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr; const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function niceMax(v){ if (v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p; return 10*p; }
function shortEur(v){ return v>=1e6 ? (v/1e6).toLocaleString('de-DE',{maximumFractionDigits:1})+' Mio' : v>=1e4 ? Math.round(v/1e3).toLocaleString('de-DE')+' Tsd' : Math.round(v).toLocaleString('de-DE'); }
function axes(ctx,w,h,pad,ymax,xmax,xlab){
  ctx.font = '12px "IBM Plex Mono", monospace'; ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
  for (let k=0;k<=4;k++){ const y = pad.t + (h-pad.t-pad.b)*(1-k/4); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(shortEur(ymax*k/4), pad.l-6, y); }
  ctx.textAlign='center'; ctx.textBaseline='top';
  const step = xmax>30?10:xmax>12?5:xmax>5?2:1;
  for (let x=0;x<=xmax;x+=step){ const px = pad.l + (w-pad.l-pad.r)*x/xmax; ctx.fillText(x, px, h-pad.b+6); }
  ctx.textAlign='right'; ctx.fillText(xlab, w-pad.r, h-14);
}
