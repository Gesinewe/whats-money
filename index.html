      <p>Stell ein, wie viel Moni anlegt und wie lange. Gold zeigt, was der Zinseszins dazu legt.</p>
      <div class="sliders">
        ${slider('zS','Startbetrag',0,20000,500,1000,eur)}
        ${slider('zM','Sparrate pro Monat',0,1000,10,50,eur)}
        ${slider('zR','Zins pro Jahr',0,12,0.5,7,v=>v.toLocaleString('de-DE')+' %')}
        ${slider('zJ','Jahre',1,50,1,30,v=>v+' J.')}
      </div>
      <div class="kpis"><div class="kpi hl"><span class="label">Endbetrag</span><b id="zE"></b></div><div class="kpi"><span class="label">Selbst eingezahlt</span><b id="zP"></b></div><div class="kpi"><span class="label">Durch Zinsen</span><b id="zZ"></b></div><div class="kpi"><span class="label">Verdopplung nach (72er-Regel)</span><b id="zD"></b></div></div>
      <canvas id="zC" aria-label="Diagramm: eingezahltes Geld und Zinsen über die Jahre"></canvas>
      <div class="legend"><span style="--k:var(--mint)">Selbst eingezahlt</span><span style="--k:var(--gold)">Zinsen und Zinseszinsen</span></div></div>`,
    init:()=>{
      const draw = () => {
        const S0=+$('#zS').value, M=+$('#zM').value, r=+$('#zR').value/100, J=+$('#zJ').value;
        let b=S0, paid=S0; const bal=[b], pd=[paid];
        for (let y=1;y<=J;y++){ for (let m=0;m<12;m++){ b = b*(1+r/12) + M; paid += M; } bal.push(b); pd.push(paid); }
        $('#zE').textContent=eur(b); $('#zP').textContent=eur(paid); $('#zZ').textContent=eur(b-paid); $('#zD').textContent= r>0 ? '≈ '+(72/(r*100)).toLocaleString('de-DE',{maximumFractionDigits:1})+' Jahren' : 'nie';
        const {ctx,w,h}=setupCanvas($('#zC')); const pad={l:58,r:10,t:10,b:28}; const ymax=niceMax(Math.max(...bal));
        axes(ctx,w,h,pad,ymax,J,'Jahre');
        const X=y=>pad.l+(w-pad.l-pad.r)*y/J, Y=v=>pad.t+(h-pad.t-pad.b)*(1-v/ymax);
        const area=(arr,base,col)=>{ ctx.beginPath(); arr.forEach((v,y)=>y?ctx.lineTo(X(y),Y(v)):ctx.moveTo(X(y),Y(v))); for(let y=J;y>=0;y--) ctx.lineTo(X(y),Y(base?base[y]:0)); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); };
        ctx.globalAlpha=.85; area(bal,pd,css('--gold')); area(pd,null,css('--mint')); ctx.globalAlpha=1;
      };
      bindSliders(['zS','zM','zR','zJ'],[eur,eur,v=>v.toLocaleString('de-DE')+' %',v=>v+' J.'],draw);
      EXTRAS.zins.redraw = draw;
    }},
  kredit:{
    html:()=>`<div class="tool"><h3>Der Kreditrechner</h3>
      <p>Moni möchte etwas auf Kredit kaufen. Spiel mit Zins und Laufzeit und schau, was es am Ende wirklich kostet.</p>
      <div class="sliders">
        ${slider('kB','Kreditbetrag',500,50000,500,10000,eur)}
        ${slider('kZ','Effektiver Jahreszins',0,20,0.5,7,v=>v.toLocaleString('de-DE')+' %')}
        ${slider('kL','Laufzeit',6,120,6,60,v=>v+' Monate')}
      </div>
      <div class="kpis"><div class="kpi hl"><span class="label">Monatsrate</span><b id="kR"></b></div><div class="kpi"><span class="label">Zinsen insgesamt</span><b id="kI"></b></div><div class="kpi"><span class="label">Zinsanteil 1. Rate</span><b id="kF"></b></div><div class="kpi"><span class="label">Zinsanteil letzte Rate</span><b id="kE"></b></div></div>
      <div class="say">${moni('think')}<div class="bubble"><p id="kSay"></p></div></div></div>`,
    init:()=>{
      const f=v=>v.toLocaleString('de-DE')+' %';
      const calc = () => {
        const P=+$('#kB').value, i=+$('#kZ').value/100/12, n=+$('#kL').value;
        const rate = i===0 ? P/n : P*i/(1-Math.pow(1+i,-n));
        const total = rate*n - P;
        let rest=P, firstI=P*i, lastI=0; for(let m=0;m<n;m++){ const z=rest*i; lastI=z; rest-= (rate-z); }
        $('#kR').textContent=eur(rate); $('#kI').textContent=eur(total); $('#kF').textContent=eur(firstI); $('#kE').textContent=eur(lastI);
        $('#kSay').innerHTML = total<=0 ? 'Null Prozent? Schön wär’s – achte dann auf versteckte Kosten wie Restschuldversicherungen.' : `Für ${eur(P)} zahle ich am Ende <b>${eur(P+total)}</b> zurück. ${total/P>0.25?'Das ist mehr als ein Viertel extra – lohnt sich der Kauf wirklich?':'Je kürzer die Laufzeit, desto weniger Zinsen – aber desto höher die Rate.'}`;
      };
      bindSliders(['kB','kZ','kL'],[eur,f,v=>v+' Monate'],calc);
    }},
  markt:{
    html:()=>`<div class="tool"><h3>Monis Limonadenstand</h3>
      <p>Moni verkauft Limonade. Stell den Preis ein und schau, wie viele Leute kaufen wollen und wie viele Becher Moni dafür machen möchte.</p>
      ${slider('lP','Preis pro Becher',0.25,3,0.25,1,v=>v.toLocaleString('de-DE',{style:'currency',currency:'EUR'}))}
      <div class="row"><button class="mini" id="lHeat" aria-pressed="false">Hitzewelle: alle haben Durst</button><button class="mini" id="lCap" aria-pressed="false">Der Staat bestimmt: höchstens 1 €</button></div>
      <div class="bars">
        <div class="bar"><span>Leute wollen kaufen</span><i id="lDb" style="--c:var(--gold)"></i><b id="lD"></b></div>
        <div class="bar"><span>Moni will verkaufen</span><i id="lSb" style="--c:var(--mint)"></i><b id="lS"></b></div>
      </div>
      <div class="kpis"><div class="kpi hl"><span class="label">Verkaufte Becher</span><b id="lQ"></b></div><div class="kpi"><span class="label">Gehen leer aus</span><b id="lM"></b></div><div class="kpi"><span class="label">Bleiben übrig</span><b id="lU"></b></div></div>
      <div class="say">${moni('think')}<div class="bubble"><p id="lSay"></p></div></div></div>`,
    init:()=>{
      let heat=false, cap=false;
      const fmt=v=>v.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
      const calc = () => {
        const el=$('#lP'); if (cap && +el.value>1){ el.value=1; $('#lPV').textContent=fmt(1); }
        const p=+el.value, D=Math.max(0,Math.round((heat?160:120)-40*p)), Sv=Math.max(0,Math.round(40*p-20)), Q=Math.min(D,Sv);
        const eq = heat ? 2.25 : 1.75;
        $('#lD').textContent=D+' Becher'; $('#lS').textContent=Sv+' Becher'; $('#lDb').style.width=(D/160*100)+'%'; $('#lSb').style.width=(Sv/160*100)+'%';
        $('#lQ').textContent=Q; $('#lM').textContent=Math.max(0,D-Sv); $('#lU').textContent=Math.max(0,Sv-D);
        let t;
        if (D-Sv > 5) t = (Sv === 0 ? `${D} Leute wollen kaufen, aber für ${fmt(p)} lohnt es sich für mich gar nicht, Limonade zu machen. ` : `${D} Leute wollen kaufen, aber ich mache nur ${Sv} Becher – ${D-Sv} gehen leer aus. Eine lange Schlange! `)+(cap
          ? 'Ich darf aber nicht mehr als 1 € verlangen. Dann lohnt es sich nicht, mehr Limonade zu machen – der Mangel bleibt. So ähnlich war es in der Planwirtschaft.'
          : `Bei so vielen Käufern kann ich mehr verlangen – und dann lohnt es sich auch, mehr Limonade zu machen.${heat?' Die Hitzewelle hat die Nachfrage nach oben getrieben.':''}`);
        else if (Sv-D > 5) t = `Ich habe ${Sv} Becher gemacht, aber ${D === 0 ? 'zu diesem Preis will niemand kaufen' : `nur ${D} Leute wollen sie zu diesem Preis`}. ${Sv-D} Becher bleiben übrig. Ich sollte billiger werden.`;
        else t = `Passt! Fast genau so viele wollen kaufen, wie ich verkaufen will. Das ist der <b>Marktpreis</b> – hier um ${fmt(eq)}. Ich verkaufe ${Q} Becher und nehme ${fmt(Q*p)} ein.`;
        $('#lSay').innerHTML = t;
      };
      const tog = (id, fn) => { const b=$(id); b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); fn(on); calc(); }; };
      tog('#lHeat', on => heat=on); tog('#lCap', on => cap=on);
      bindSliders(['lP'],[fmt],calc);
    }},
  sortieren:{
    html:()=>`<div class="tool"><h3>Konsum oder Investition?</h3>
      <p>Hilf Moni beim Sortieren. Manchmal kommt es auf die Situation an – hier zählt der typische Fall.</p>
      <div class="sort">${SORT_ITEMS.map((it,k)=>`<div class="it" id="so${k}"><span>${it[0]}<small id="sx${k}"></small></span><span class="row"><button class="mini" data-k="${k}" data-v="K">Konsum</button><button class="mini" data-k="${k}" data-v="I">Investition</button></span></div>`).join('')}</div>
      <p class="label" id="soScore">0 von ${SORT_ITEMS.length} richtig</p></div>`,
    init:()=>{
      let right=0;
      view.querySelectorAll('.sort .mini').forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k, it=SORT_ITEMS[k], ok=b.dataset.v===it[1];
        if (ok) right++;
        $('#so'+k).classList.add(ok?'ok':'no');
        $('#sx'+k).textContent=(ok?'Richtig: ':'Eher '+(it[1]==='K'?'Konsum':'Investition')+': ')+it[2];
        $('#so'+k).querySelectorAll('button').forEach(x=>x.disabled=true);
        $('#soScore').textContent=right+' von '+SORT_ITEMS.length+' richtig';
      });
    }}
};

/* ---------- Anlage-Simulator ---------- */
const ASSETS = [
  { id:'cash', name:'Unterm Kopfkissen', note:'Bargeld, 0 % Zinsen', need:null, ret:()=>0 },
  { id:'konsum', name:'Sofort ausgeben', note:'Ein toller Urlaub – danach ist das Geld weg', need:null, ret:null },
  { id:'tages', name:'Tagesgeld', note:'Sicher, rund 2 % Zinsen', need:'bank', tax:'kap', ret:()=>0.02 },
  { id:'etf', name:'ETF Welt', note:'1.300 Firmen weltweit, schwankt', need:'boerse', tax:'kap', ret:()=>Math.exp(0.06+0.15*randn())-1 },
  { id:'aktie', name:'Eine Einzelaktie', note:'Eine Firma – kann steigen oder pleitegehen', need:'boerse', tax:'kap', ret:()=> Math.random()<0.02 ? -1 : Math.exp(0.035+0.35*randn())-1 },
  { id:'gold', name:'Gold', note:'Keine Zinsen, Krisenschutz', need:'tresor', tax:'frei', ret:()=>Math.exp(0.035+0.14*randn())-1 },
  { id:'btc', name:'Bitcoin', note:'Extrem schwankend', need:'krypto', tax:'frei', ret:()=>Math.exp(0.10+0.75*randn())-1 }
];
const TRADE = ASSETS.filter(a => a.tax);
const YEARS = 25, TAX = 0.26375, FREI = 1000;   // Abgeltungsteuer + Soli, Sparerpauschbetrag pro Jahr
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const avail = a => !a.need || S.free || isDone(a.need);
const sgn = n => (n>=0?'+':'−') + eur(Math.abs(n));
const pct = x => (x>=0?'+':'−') + Math.abs(Math.round(x*100)) + ' %';
let alloc = { cash:100 }, simTimer = null, G = null;

function showSim(){
  cur = null; clearInterval(simTimer); G = null;
  ASSETS.forEach(a => { if (!avail(a)) delete alloc[a.id]; });
  view.innerHTML = `<section class="panel">
    <div class="crumbs"><button class="back" id="back">← Karte</button><span class="label">Finale</span></div>
    <div class="row between"><h2>Anlage-Simulator</h2><span id="simMode"></span></div>
    <div class="say"><span id="simMoni" style="flex:none">${moni('think',true)}</span><div class="bubble"><p id="simSay">Ich habe <b>${eur(S.money)}</b>. Wie soll ich sie verteilen? Wir spielen <b>${YEARS} Jahre</b> durch – Jahr für Jahr. Unterwegs kann ich <b>Gewinne mitnehmen</b>, <b>Verluste realisieren</b> und das Geld <b>neu anlegen</b>. Was nicht verteilt ist, liegt unterm Kopfkissen.</p></div></div>
    <div id="simCtl"></div>
    <canvas id="sC" aria-label="Diagramm: Wert von Monis Vermögen über die Jahre"></canvas>
    <div class="legend"><span style="--k:var(--mint)">Vermögen</span><span style="--k:var(--gold)">Kaufkraft in heutigen Euro</span><span style="--k:var(--muted)">Startgeld</span></div>
    <div class="news" id="news" aria-live="polite"><span>Noch keine Nachrichten. Verteile das Geld und starte.</span></div>
    <div id="simRes"></div>
    ${pro() ? `<details class="info"><summary>So rechnet Moni die Steuern</summary>
      <ul><li>Steuer fällt erst an, wenn du <b>verkaufst</b> – Buchgewinne sind steuerfrei, solange du hältst.</li>
      <li>Auf Gewinne aus Tagesgeld, ETF und Einzelaktie: <b>26,375 %</b> (25 % Abgeltungsteuer plus Soli).</li>
      <li>Die ersten <b>1.000 €</b> Gewinn pro Spieljahr sind frei (Sparerpauschbetrag). Ein ungenutzter Rest verfällt am Jahresende.</li>
      <li>Verluste werden sofort mit Gewinnen desselben Jahres verrechnet – bereits gezahlte Steuer kommt zurück. Was übrig bleibt, wandert in den <b>Verlusttopf</b> und mindert spätere Gewinne.</li>
      <li>Gold und Bitcoin sind steuerfrei (in echt erst nach mehr als einem Jahr Haltedauer), ihre Verluste zählen aber auch nicht.</li>
      <li>Nicht abgebildet: Teilfreistellung (30 % bei Aktien-ETFs), Vorabpauschale, jährliche Besteuerung von Zinsen, Kirchensteuer und der getrennte Aktienverlusttopf. Mehr dazu in der Station <b>Finanzamt</b>.</li></ul></details>`
    : `<details class="info"><summary>Und was ist mit Steuern?</summary>
      <p>Im echten Leben gibt man von Gewinnen ungefähr ein Viertel als Steuer ab – aber erst, wenn man mehr als 1.000 € Gewinn im Jahr macht. Im Modus „Einfach“ lassen wir das weg. Im Modus „Profi“ rechnet Moni die Steuern mit. Was Steuern sind, erfährst du in der Station <b>Finanzamt</b>.</p></details>`}
    <p class="label">Spielannahmen: Tagesgeld 2 %, ETF im Mittel gut 7 % bei starken Schwankungen, Einzelaktie mit 2 % Pleiterisiko pro Jahr, Gold gut 4 %, Bitcoin extrem schwankend, Inflation um 2,5 %.${pro()?` Steuern vereinfacht: 26,375 % (Abgeltungsteuer plus Soli, ohne Kirchensteuer und Teilfreistellung) auf Gewinne aus Tagesgeld, ETF und Aktie über 1.000 € Sparerpauschbetrag pro Jahr, fällig beim Verkauf; Verluste werden verrechnet. Gold und Bitcoin sind in Deutschland nach über einem Jahr Haltedauer steuerfrei – im Spiel immer.`:' Steuern lässt der Modus „Einfach“ weg – im Profi-Modus rechnet Moni sie mit.'} Keine Prognose.</p>
    ${srcBox(SIM_SRC, 'Quellen zum Simulator')}
  </section>`;
  $('#back').onclick = () => { clearInterval(simTimer); showMap(); };
  renderSetup(); drawSim(null); wallet(); renderMode();
}
function renderMode(){
  const locked = !!(G && !G.done);
  $('#simMode').innerHTML = modeSwitch(locked) ;
  if (locked) $('#simMode .seg').insertAdjacentHTML('beforeend','<small>Umschalten geht nach dem Durchlauf.</small>');
  bindMode(showSim);
}
function setSay(mood, html){ $('#simMoni').innerHTML = moni(mood,true); $('#simSay').innerHTML = html; }

function renderSetup(){
  $('#simCtl').innerHTML = `<div class="alloc">${ASSETS.filter(a=>a.id!=='cash').map(a=>{ const ok=avail(a); const st=STATIONS.findIndex(s=>s.id===a.need);
      return `<div class="al${ok?'':' locked'}"><span class="nm"><b>${a.name}</b><small>${ok?a.note:'Frei nach Station '+(st+1)+': '+STATIONS[st].name}</small></span><span class="pc" id="p_${a.id}">${alloc[a.id]||0} %</span>
      <input type="range" id="r_${a.id}" min="0" max="100" step="5" value="${alloc[a.id]||0}" ${ok?'':'disabled'} aria-label="Anteil ${a.name}"></div>`; }).join('')}
      <div class="al"><span class="nm"><b>Unterm Kopfkissen</b><small>Der Rest. Kein Zins – die Inflation nagt daran.</small></span><span class="pc" id="p_cash"></span></div>
    </div>
    <div class="row"><button class="btn primary" id="run">Geld anlegen und los</button></div>`;
  const upd = () => {
    let sum=0; ASSETS.forEach(a=>{ if(a.id==='cash') return; const el=$('#r_'+a.id); alloc[a.id]=+el.value; sum+=alloc[a.id]; });
    if (sum>100){ const last=document.activeElement; if(last && last.id && last.id.startsWith('r_')){ const id=last.id.slice(2); alloc[id]-= sum-100; last.value=alloc[id]; sum=100; } }
    ASSETS.forEach(a=>{ if(a.id!=='cash') $('#p_'+a.id).textContent=(alloc[a.id]||0)+' %'; });
    alloc.cash = 100-sum; $('#p_cash').textContent = alloc.cash+' %';
  };
  ASSETS.forEach(a=>{ if(a.id!=='cash') $('#r_'+a.id).oninput = upd; });
  upd();
  $('#run').onclick = startSim;
}

function startSim(){
  const start = S.money;
  G = { start, y:0, cash:start*(alloc.cash||0)/100, fun:start*(alloc.konsum||0)/100, pos:{}, price:1,
        hist:[{tot:start, real:start}], news:[], pro:pro(), yGain:0, paidY:0, carry:0, taxTot:0, realTot:0,
        trades:0, crashY:-1, panic:false, dip:false, busy:false, pause:true, done:false };
  TRADE.forEach(a => { const v = start*(alloc[a.id]||0)/100; G.pos[a.id] = { val:v, cost:v, real:0 }; });
  G.news.push('<span>Jahr 0: Das Geld ist angelegt. Los geht’s!</span>');
  renderNews();
  setSay('happy', `Jetzt läuft die Zeit. Nach jedem Jahr kann ich handeln: <b>Gewinne mitnehmen</b> (mit Plus verkaufen), <b>Verluste realisieren</b> (mit Minus verkaufen – erst dann ist der Verlust echt, vorher steht er nur auf dem Papier) und Bargeld <b>neu anlegen</b>.${G.pro?' Aber Vorsicht: Auf Gewinne über 1.000 € im Jahr zahle ich Steuern.':''}`);
  renderPlay(); drawSim(G.hist); renderMode();
}
const total = () => G.cash + TRADE.reduce((s,a)=>s+G.pos[a.id].val, 0);
function renderNews(){ $('#news').innerHTML = G.news.slice().reverse().join(''); }

function renderPlay(focusId){
  const fid = focusId || (document.activeElement && document.activeElement.id);
  const off = G.busy || G.done;
  const rows = TRADE.filter(avail).map(a => {
    const p = G.pos[a.id], bg = p.val-p.cost, has = p.val>=0.5 || p.cost>=0.5;
    const info = has ? `Eingesetzt ${eur(p.cost)} · <span class="${bg>=0?'gain':'loss'}">${G.pro?(bg>=0?'Buchgewinn':'Buchverlust'):(bg>=0?'Plus auf dem Papier':'Minus auf dem Papier')} ${sgn(bg)}${p.cost>=0.5?' ('+pct(bg/p.cost)+')':''}</span>` : a.note;
    const sd = off || !has ? 'disabled' : '', bd = off || G.cash<1 ? 'disabled' : '';
    return `<div class="al"><span class="nm"><b>${a.name}</b><small>${info}</small></span><span class="pc">${eur(p.val)}</span>
      <div class="trade"><span class="grp"><span class="label">Verkaufen</span>
        ${PARTS.map(([k,t,w])=>`<button class="mini" id="s_${a.id}_${k}" ${sd} aria-label="${a.name}: ${w} verkaufen">${t}</button>`).join('')}</span>
        <span class="grp"><span class="label">Kaufen mit Bargeld</span>
        ${PARTS.map(([k,t,w])=>`<button class="mini" id="b_${a.id}_${k}" ${bd} aria-label="${a.name}: mit ${w==='alles'?'dem ganzen':w+' des'} Bargeld${w==='alles'?'':'s'} kaufen">${t}</button>`).join('')}</span>
        <span class="grp"><span class="label">Betrag</span>
        <input type="number" class="amt" id="v_${a.id}" min="1" step="any" inputmode="decimal" placeholder="€" ${off||(!has&&G.cash<1)?'disabled':''} aria-label="${a.name}: Betrag in Euro">
        <button class="mini" id="sv_${a.id}" ${sd} aria-label="${a.name}: Betrag verkaufen">verkaufen</button>
        <button class="mini" id="bv_${a.id}" ${bd} aria-label="${a.name}: für Betrag kaufen">kaufen</button></span></div></div>`;
  }).join('');
  $('#simCtl').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span class="label">Jahr</span><b>${G.y} von ${YEARS}</b></div>
      <div class="kpi hl"><span class="label">Vermögen</span><b>${eur(total())}</b></div>
      <div class="kpi"><span class="label">${G.pro?'Realisiert':'Aus Verkäufen'}</span><b class="${G.realTot>=0?'gain':'loss'}">${sgn(G.realTot)}</b></div>
      ${G.pro?`<div class="kpi"><span class="label">Steuern gezahlt</span><b>${eur(G.taxTot)}</b></div>`:''}
      ${G.pro && G.carry+Math.min(0,G.yGain) < -0.5 ? `<div class="kpi"><span class="label">Verlusttopf</span><b class="loss">${sgn(G.carry+Math.min(0,G.yGain))}</b></div>` : ''}
    </div>
    <div class="alloc">${rows}
      <div class="al"><span class="nm"><b>Bargeld</b><small>Rest und Geld aus Verkäufen. Kein Zins – bereit zum Neu-Anlegen.</small></span><span class="pc">${eur(G.cash)}</span></div>
    </div>
    ${G.done ? `<div class="row"><button class="btn primary" id="again">Nochmal von vorn</button></div>` : `
    <div class="row"><button class="btn primary" id="y1" ${off?'disabled':''}>1 Jahr weiter</button><button class="btn" id="y5" ${off?'disabled':''}>5 Jahre weiter</button><button class="btn" id="yE" ${off?'disabled':''}>Bis Jahr ${YEARS}</button></div>
    <label class="toggle"><input type="checkbox" id="pauseEv" ${G.pause?'checked':''}> Bei Crashs und Höhenflügen anhalten</label>`}`;
  TRADE.filter(avail).forEach(a => {
    PARTS.forEach(([k,,,f]) => {
      $('#s_'+a.id+'_'+k).onclick = () => sell(a, f);
      $('#b_'+a.id+'_'+k).onclick = () => buy(a, f === 1 ? G.cash : G.cash*f);
    });
    const amt = () => parseFloat(String($('#v_'+a.id).value).replace(',', '.'));
    $('#sv_'+a.id).onclick = () => sellAmt(a, amt());
    $('#bv_'+a.id).onclick = () => buyAmt(a, amt());
  });
  if (G.done) $('#again').onclick = showSim;
  else {
    $('#y1').onclick = () => advance(1); $('#y5').onclick = () => advance(5); $('#yE').onclick = () => advance(YEARS);
    $('#pauseEv').onchange = e => { G.pause = e.target.checked; };
  }
  const f = fid && document.getElementById(fid);
  if (f && !f.disabled) f.focus();
}

const PARTS = [['q','¼','ein Viertel',.25],['h','½','die Hälfte',.5],['d','¾','drei Viertel',.75],['a','alles','alles',1]];
function badAmt(){ setSay('think', 'Gib einen Betrag in Euro ein, zum Beispiel <b>100</b>.'); }
function sellAmt(a, amt){
  const v = G.pos[a.id].val;
  if (!(amt >= 1)) return badAmt();
  if (amt > v + 0.5) return setSay('think', `So viel steckt in ${a.name} gar nicht drin – höchstens <b>${eur(v)}</b>.`);
  sell(a, amt >= v - 0.5 ? 1 : amt / v);
}
function buyAmt(a, amt){
  if (!(amt >= 1)) return badAmt();
  if (amt > G.cash + 0.5) return setSay('think', `So viel Bargeld habe ich nicht – nur <b>${eur(G.cash)}</b>. Vielleicht erst etwas anderes verkaufen?`);
  buy(a, amt >= G.cash - 0.5 ? G.cash : amt);
}
function sell(a, part){
  const p = G.pos[a.id], v = p.val*part, c = p.cost*part, gain = v-c;
  if (part === 1){ p.val = 0; p.cost = 0; } else { p.val -= v; p.cost -= c; }
  G.cash += v; p.real += gain; G.realTot += gain; G.trades++;
  let taxTxt = '';
  if (G.pro && a.tax === 'kap'){
    G.yGain += gain;
    const due = Math.max(0, G.yGain + G.carry - FREI) * TAX, d = due - G.paidY;
    G.cash -= d; G.paidY = due; G.taxTot += d;
    taxTxt = d > 0.5 ? ` Steuern: ${eur(d)}.` : d < -0.5 ? ` ${eur(-d)} Steuern zurück, weil der Verlust verrechnet wird.` : gain >= 0.5 ? ' Steuerfrei dank Freibetrag.' : gain <= -0.5 ? ' Der Verlust kommt in den Verlusttopf und senkt spätere Steuern.' : '';
  } else if (G.pro && gain >= 0.5) taxTxt = ' Steuerfrei nach einem Jahr Haltedauer.';
  const panic = gain < 0 && G.y === G.crashY && (a.id === 'etf' || a.id === 'aktie');
  if (panic) G.panic = true;
  G.news.push(`<span class="${gain>=0?'good':'bad'}">Jahr ${G.y}: ${gain>=0?'Gewinn mitgenommen':'Verlust realisiert'} – ${a.name} für ${eur(v)} verkauft (${sgn(gain)}).${taxTxt}</span>`);
  renderNews();
  setSay(gain>=0?'happy':'think', panic
    ? 'Verkauft mitten im Crash. Das fühlt sich sicher an – aber jetzt ist der Verlust echt. Wer durchhält, erlebt oft die Erholung.'
    : gain >= 0 ? `Gewinn gesichert: <b>${sgn(gain)}</b>. Das Geld liegt jetzt als Bargeld bereit – ohne Zinsen. Lege ich es neu an?`
    : `Verlust realisiert: <b>${sgn(gain)}</b>. Weh tut’s trotzdem – aber jetzt kann ich das Geld woanders neu anlegen${G.pro&&a.tax==='kap'?', und der Verlust spart mir Steuern auf spätere Gewinne':''}.`);
  renderPlay();
}
function buy(a, amt){
  if (amt < 1) return;
  const p = G.pos[a.id]; G.cash -= amt; p.val += amt; p.cost += amt; G.trades++;
  const dip = a.id === 'etf' && G.y === G.crashY;
  if (dip) G.dip = true;
  G.news.push(`<span>Jahr ${G.y}: ${G.realTot!==0||G.y>0?'Neu angelegt':'Angelegt'} – ${eur(amt)} in ${a.name}.</span>`);
  renderNews();
  setSay(dip?'wow':'happy', dip ? 'Im Crash nachgekauft – mutig! Jetzt bekomme ich die Anteile zum Schnäppchenpreis.' : `${eur(amt)} stecken jetzt in <b>${a.name}</b>. Mal sehen, was die Zeit daraus macht.`);
  renderPlay();
}

function advance(n){
  if (G.busy || G.done) return;
  const fid = document.activeElement && document.activeElement.id;
  const target = Math.min(YEARS, G.y+n);
  G.busy = true; renderPlay();
  const tick = () => {
    const ev = yearStep();
    const stop = G.y >= target || (ev && G.pause && n > 1);
    if (stop){ clearInterval(simTimer); G.busy = false; }
    if (G.y >= YEARS) finishSim();
    else if (ev) setSay(ev.mood, ev.say);
    else if (stop) setSay('think', hint());
    renderPlay(stop ? fid : null); drawSim(G.hist);
    return stop;
  };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ while (!tick()); }
  else simTimer = setInterval(tick, 140);
}
function yearStep(){
  G.carry = Math.min(0, G.yGain + G.carry); G.yGain = 0; G.paidY = 0;
  G.y++;
  const infl = Math.max(-0.01, 0.025 + 0.012*randn()); G.price *= 1+infl;
  const r = {};
  TRADE.forEach(a => { const p = G.pos[a.id]; if (p.val <= 0) return; r[a.id] = a.ret(); p.val *= 1 + r[a.id]; });
  const tot = total(); G.hist.push({tot, real: tot/G.price});
  const add = (t,c) => G.news.push(`<span class="${c}">Jahr ${G.y}: ${t}</span>`);
  let ev = null;
  if (r.etf < -0.2){ G.crashY = G.y; add(`Börsencrash! Viele wollen gleichzeitig verkaufen, kaum jemand will kaufen – der Weltindex fällt um ${Math.round(-r.etf*100)} %.`,'bad');
    ev = {mood:'sad', say:`Crash! Viele Anleger verkaufen in Panik, und kaum jemand kauft – darum ist mein ETF um ${Math.round(-r.etf*100)} % gefallen. Verkaufe ich jetzt, wird der Verlust echt. Durchhalten – oder sogar günstig nachkaufen?`}; }
  else if (r.etf > 0.25){ add(`Starkes Börsenjahr: Mehr Käufer als Verkäufer – ETF +${Math.round(r.etf*100)} %.`,'good');
    ev = {mood:'wow', say:`Was für ein Jahr: Viele wollen Aktien haben, das treibt die Kurse – ETF +${Math.round(r.etf*100)} %! Nehme ich einen Teil des Gewinns mit – oder lasse ich ihn weiterlaufen?`}; }
  if (r.aktie === -1){ add('Deine Einzelaktie ist pleite. Alles weg.','bad');
    ev = {mood:'sad', say: G.pro ? 'Meine Einzelaktie ist pleite – sie ist nichts mehr wert. Wenn ich sie verkaufe, wird der Verlust realisiert und senkt meine Steuern auf andere Gewinne.' : 'Meine Einzelaktie ist pleite – sie ist nichts mehr wert. Darum steckt man nie alles in eine einzige Firma.'}; }
  if (r.btc < -0.55){ add(`Krypto-Winter: Viele verkaufen, kaum jemand kauft – Bitcoin −${Math.round(-r.btc*100)} %.`,'bad');
    ev = ev || {mood:'sad', say:`Bitcoin ist um ${Math.round(-r.btc*100)} % abgestürzt. Aussteigen oder abwarten?`}; }
  else if (r.btc > 1){ add(`Bitcoin-Rausch: Alle wollen Bitcoin, aber es gibt nicht mehr davon – +${Math.round(r.btc*100)} %!`,'good');
    ev = ev || {mood:'wow', say:`Bitcoin +${Math.round(r.btc*100)} %! Gewinne mitnehmen, bevor der nächste Absturz kommt?`}; }
  if (r.gold > 0.25) add(`Goldrausch: Viele kaufen Gold aus Angst vor Krisen – die Nachfrage treibt den Preis: +${Math.round(r.gold*100)} %.`,'good');
  else if (r.gold < -0.15) add(`Gold −${Math.round(-r.gold*100)} %: Die Angst lässt nach, weniger Leute wollen Gold kaufen.`,'bad');
  if (infl > 0.045) add(`Hohe Inflation: Preise steigen um ${(infl*100).toFixed(1).replace('.',',')} %.`,'bad');
  renderNews();
  return ev;
}
function hint(){
  const held = TRADE.filter(a => G.pos[a.id].cost >= 0.5).map(a => ({a, x: G.pos[a.id].val/G.pos[a.id].cost - 1}));
  const up = held.sort((p,q) => q.x-p.x)[0], down = held[held.length-1];
  if (up && up.x > 0.5) return `Jahr ${G.y}: <b>${up.a.name}</b> liegt ${pct(up.x)} im Plus. Gewinn mitnehmen oder laufen lassen?`;
  if (down && down.x < -0.2) return `Jahr ${G.y}: <b>${down.a.name}</b> liegt ${pct(down.x)} im Minus. Verkaufen würde den Verlust echt machen. Hoffen oder Schlussstrich?`;
  if (G.cash > total()*0.3 && G.y < YEARS) return `Jahr ${G.y}: Viel Bargeld liegt ohne Zinsen herum (${eur(G.cash)}). Lege ich es neu an?`;
  return `Jahr ${G.y}: Alles im Rahmen. Wie geht es weiter?`;
}

function drawSim(hist){
  const cv=$('#sC'); if(!cv) return; const {ctx,w,h}=setupCanvas(cv); const pad={l:58,r:10,t:10,b:28};
  const start=G?G.start:S.money; const ymax=niceMax(Math.max(start*1.5, ...(hist||[]).map(p=>p.tot)));
  axes(ctx,w,h,pad,ymax,YEARS,'Jahre');
  const X=y=>pad.l+(w-pad.l-pad.r)*y/YEARS, Y=v=>pad.t+(h-pad.t-pad.b)*(1-v/ymax);
  ctx.setLineDash([3,4]); ctx.strokeStyle=css('--muted'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X(0),Y(start)); ctx.lineTo(X(YEARS),Y(start)); ctx.stroke(); ctx.setLineDash([]);
  if(!hist) return;
  const line=(key,col,dash)=>{ ctx.setLineDash(dash||[]); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.beginPath(); hist.forEach((p,y)=>y?ctx.lineTo(X(y),Y(p[key])):ctx.moveTo(X(y),Y(p[key]))); ctx.stroke(); ctx.setLineDash([]);
    const l=hist[hist.length-1]; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(hist.length-1),Y(l[key]),4,0,7); ctx.fill(); };
  line('real',css('--gold'),[6,4]); line('tot',css('--mint'));
}
function finishSim(){
  G.done = true; G.busy = false; renderMode();
  const start = G.start, end = G.hist[G.hist.length-1], realGain = end.real/start - 1;
  let open = 0; TRADE.forEach(a => { if (a.tax === 'kap') open += G.pos[a.id].val - G.pos[a.id].cost; });
  const exitTax = Math.max(0, Math.max(0, G.yGain + open + G.carry - FREI)*TAX - G.paidY);
  const rows = TRADE.filter(a => { const p = G.pos[a.id]; return p.cost >= 0.5 || p.val >= 0.5 || Math.abs(p.real) >= 0.5; }).map(a => { const p = G.pos[a.id];
    return `<tr><td>${a.name}</td><td class="num">${eur(p.val)}</td><td class="num">${p.cost>=0.5||p.val>=0.5?sgn(p.val-p.cost):'–'}</td><td class="num">${Math.abs(p.real)>=0.5?sgn(p.real):'–'}</td></tr>`; }).join('')
    + `<tr><td>Bargeld</td><td class="num">${eur(G.cash)}</td><td class="num">–</td><td class="num">–</td></tr>`
    + (G.fun > 0 ? `<tr><td>Sofort ausgegeben</td><td class="num">Erinnerungen</td><td class="num">–</td><td class="num">−${eur(G.fun)}</td></tr>` : '');
  let trade = '';
  if (G.panic) trade = 'Ich habe im Crash mit Verlust verkauft. Hinterher ist man immer schlauer – aber oft erholt sich die Börse wieder. ';
  else if (G.dip) trade = 'Im Crash nachzukaufen war mutig – genau dann gibt es Anteile zum Schnäppchenpreis. ';
  else if (G.trades === 0) trade = 'Ich habe einfach alles liegen lassen. Bei breit gestreuten Anlagen ist das oft gar keine schlechte Idee. ';
  if (G.cash > end.tot*0.5 && (alloc.cash||0) < 50) trade += 'Am Ende lag viel als Bargeld herum – Gewinne mitnehmen ist gut, aber ohne Zinsen nagt die Inflation daran. ';
  let say;
  if ((alloc.cash||0) >= 80 && G.trades === 0) say = `Unterm Kopfkissen ist nichts weggekommen – und trotzdem kann ich mir heute nur noch so viel kaufen wie früher mit ${eur(end.real)}. Die Inflation hat leise ${Math.round((1-1/G.price)*100)} % gefressen.`;
  else if ((alloc.btc||0) >= 50) say = realGain>1 ? 'Wow, das ging steil! Aber war das Können oder Glück? Spiel nochmal und schau, wie oft es so gut ausgeht.' : 'Autsch. Bitcoin kann alles verdoppeln – oder halbieren. Mit so viel auf einer Karte war das eine Wette.';
  else if ((alloc.aktie||0) >= 50) say = 'Eine einzige Firma ist ein Klumpenrisiko. Spiel ein paar Mal – manchmal geht es gut, manchmal ist alles weg.';
  else if ((alloc.konsum||0) >= 50) say = 'Der Urlaub war großartig! Nur Vermögen ist davon nicht übrig. Konsum ist okay – solange ein Teil fürs Später bleibt.';
  else if ((alloc.etf||0) >= 40) say = realGain>0 ? 'Breit gestreut und lange durchgehalten – auch durch die Crashs. So arbeitet der Zinseszins.' : 'Diesmal lief es mies. Das kommt vor – aber über 25 Jahre selten. Spiel nochmal und vergleiche.';
  else say = realGain>0 ? 'Mein Geld ist auch nach der Inflation mehr wert als am Anfang. Probier andere Mischungen aus!' : 'Nach Abzug der Inflation bin ich ärmer als am Anfang. Welche Mischung schlägt die Teuerung?';
  setSay(realGain>0?'wow':'think', `Geschafft – ${YEARS} Jahre sind um! Unten steht, was aus meinem Geld geworden ist.`);
  $('#simRes').innerHTML = `<div class="kpis"><div class="kpi hl"><span class="label">Nach ${YEARS} Jahren</span><b>${eur(end.tot)}</b></div><div class="kpi"><span class="label">Kaufkraft in heutigen Euro</span><b>${eur(end.real)}</b></div><div class="kpi"><span class="label">Echter Zuwachs nach Inflation</span><b>${pct(realGain)}</b></div>${G.pro?`<div class="kpi"><span class="label">Steuern gezahlt</span><b>${eur(G.taxTot)}</b></div>`:''}</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Anlage</th><th>Am Ende</th><th>${G.pro?'Buchgewinn/-verlust':'Auf dem Papier'}</th><th>${G.pro?'Realisiert':'Schon verkauft'}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${G.pro && exitTax >= 0.5 ? `<p>Würde ich jetzt alles verkaufen, kämen noch etwa <b>${eur(exitTax)}</b> Steuern dazu.</p>` : ''}
    <div class="say">${moni(realGain>0.5?'wow':realGain>0?'happy':'sad')}<div class="bubble"><p>${trade}${say}</p></div></div>`;
}

/* ---------- Start ---------- */
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if($('#zC')&&EXTRAS.zins.redraw) EXTRAS.zins.redraw(); if($('#sC')) drawSim(G&&G.hist); },150); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if($('#zC')&&EXTRAS.zins.redraw) EXTRAS.zins.redraw(); });
showMap();
</script>
